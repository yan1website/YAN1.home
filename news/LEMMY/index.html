<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemmy News</title>
<script>
function isYAN1App(){return(window.AndroidPython&&typeof window.AndroidPython.executePython==="function")}
function openInYAN1App(){if(isYAN1App())return;if(sessionStorage.getItem("yan1_launched")==="true")return;sessionStorage.setItem("yan1_launched","true");const currentURL=window.location.href;const cleanPath=currentURL.replace(/^https?:\/\//,"");const intentURL="intent://"+cleanPath+"#Intent;scheme=https;package=com.example1.yan1appgen1;S.browser_fallback_url="+encodeURIComponent(currentURL)+";end;";window.location.href=intentURL}
setTimeout(openInYAN1App,1200)
</script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f2f2;color:#222}header{background:#238636;color:#fff;padding:18px;text-align:center}header h1{margin:0;font-size:25px}.controls,#status,#error,#articles,#rawOutput{max-width:900px;margin:15px auto}.controls{padding:0 15px;display:flex;gap:10px;flex-wrap:wrap}.controls select,.controls input,.controls button{min-height:42px;padding:9px 12px;border:1px solid #ccc;border-radius:6px;font:inherit}.controls select{flex:0 1 230px}.controls form{flex:1 1 320px;display:flex;gap:10px}.controls input{width:100%}.controls button,.button{background:#238636;color:#fff;cursor:pointer}#status{padding:12px;background:#fff;border:1px solid #ddd;border-radius:7px;text-align:center}#error{display:none;padding:15px;background:#ffe5e5;color:#b00000;border:1px solid #ffaaaa;border-radius:7px;white-space:pre-wrap}#articles{padding:0 15px}.article{background:#fff;margin-bottom:20px;padding:18px;border-radius:9px;box-shadow:0 2px 7px rgba(0,0,0,.08)}.article h2{margin:0;font-size:21px;line-height:1.4}.article h2 a{color:#222;text-decoration:none}.article-image{display:block;width:100%;max-height:500px;object-fit:contain;background:#eee;border-radius:8px;margin:15px 0;cursor:pointer}.description{font-size:16px;line-height:1.6;color:#444;margin:15px 0}.meta{color:#777;font-size:14px;line-height:1.7;margin-bottom:15px}.button{display:inline-block;padding:9px 14px;text-decoration:none;border-radius:5px}.loading{text-align:center;padding:30px;color:#666}#rawOutput{display:none;padding:15px;background:#111;color:#0f6;white-space:pre-wrap;overflow-x:auto;font-family:Consolas,monospace;font-size:13px}
@media(max-width:600px){.controls,#status,#error,#articles,#rawOutput{width:100%;max-width:none;margin-left:0;margin-right:0}.controls{padding:12px 16px}#status,#error{border-left:0;border-right:0;border-radius:0}#articles{padding:0}.article{width:100%;margin:0;padding:18px 16px;border-radius:0;box-shadow:none;border-bottom:1px solid #ddd;border-left:0;border-right:0}.article-image{width:calc(100% + 32px);max-width:none;margin-left:-16px;border-radius:0}#rawOutput{border-radius:0}}
</style>
</head>
<body>
<header><h1>Lemmy News</h1></header>
<div class="controls">
<select id="categorySelect" aria-label="Choose a category">
<option value="">Choose a category</option>
<optgroup label="News"><option value="https://lemmy.world/feeds/c/news.xml?sort=New">News</option><option value="https://lemmy.world/feeds/c/worldnews.xml?sort=New">World News</option><option value="https://lemmy.world/feeds/c/india.xml?sort=New">India</option><option value="https://lemmy.world/feeds/c/politics.xml?sort=New">Politics</option></optgroup>
<optgroup label="Technology"><option value="https://lemmy.world/feeds/c/technology.xml?sort=New">Technology</option><option value="https://lemmy.world/feeds/c/programming.xml?sort=New">Programming</option><option value="https://lemmy.world/feeds/c/linux.xml?sort=New">Linux</option><option value="https://lemmy.world/feeds/c/android.xml?sort=New">Android</option></optgroup>
<optgroup label="Gaming"><option value="https://lemmy.world/feeds/c/gaming.xml?sort=New">Gaming</option><option value="https://lemmy.world/feeds/c/games.xml?sort=New">Games</option></optgroup>
<optgroup label="Science &amp; Space"><option value="https://lemmy.world/feeds/c/science.xml?sort=New">Science</option><option value="https://lemmy.world/feeds/c/space.xml?sort=New">Space</option></optgroup>
<optgroup label="General"><option value="https://lemmy.world/feeds/c/asklemmy.xml?sort=New">Ask Lemmy</option><option value="https://lemmy.world/feeds/c/showerthoughts.xml?sort=New">Shower Thoughts</option><option value="https://lemmy.world/feeds/c/nostupidquestions.xml?sort=New">No Stupid Questions</option></optgroup>
</select>
<form id="searchForm"><input id="searchInput" type="search" placeholder="Search Lemmy posts" aria-label="Search Lemmy posts"><button type="submit">Search</button></form>
</div>
<div id="status">Loading Android app bridge...</div><div id="error"></div><div id="articles"><div class="loading">Waiting for Lemmy data...</div></div><pre id="rawOutput"></pre>
<script>
const ALL_RSS_URL="https://lemmy.world/feeds/all.xml?sort=New";let pythonCodeTemplate="";
function cleanupTrackers(id){delete window[id+"_success"];delete window[id+"_error"]}
function runPythonOnDevice(pythonCode,onSuccess,onError){if(!window.AndroidPython){const msg="Execution failed: Not running inside the YAN1 APP environment.";console.error(msg);if(onError)onError(msg);return}const requestId="py_req_"+Date.now()+"_"+Math.floor(Math.random()*1000);window[requestId+"_success"]=function(output){if(onSuccess)onSuccess(output);cleanupTrackers(requestId)};window[requestId+"_error"]=function(errorLog){if(onError)onError(errorLog);cleanupTrackers(requestId)};try{window.AndroidPython.executePython(pythonCode,requestId)}catch(error){window[requestId+"_error"](error.message||String(error))}}
window.onPythonResult=function(output,callbackId){const handler=window[callbackId+"_success"];if(handler)handler(output);else console.log("Global Catch - Python Output:\n",output)};
window.onPythonError=function(errorMessage,callbackId){const handler=window[callbackId+"_error"];if(handler)handler(errorMessage);else console.error("Global Catch - Python Error:\n",errorMessage)};
function setStatus(message){document.getElementById("status").textContent=message}function showError(message){const box=document.getElementById("error");box.style.display="block";box.textContent=message;setStatus("Error")}
function randomCategoryFeed(){const options=Array.from(document.querySelectorAll("#categorySelect option[value]"));return options[Math.floor(Math.random()*options.length)].value}
function requestFeed(feedUrl,searchTerm){const code=pythonCodeTemplate.replace(/^REQUESTED_RSS_URL = .*$/m,"REQUESTED_RSS_URL = "+JSON.stringify(feedUrl)).replace(/^SEARCH_TERM = .*$/m,"SEARCH_TERM = "+JSON.stringify(searchTerm));runPythonOnDevice(code,displayResult,showError);setStatus("Python sent to YAN1 app. Waiting for Lemmy...")}
function displayResult(output){let data;try{data=JSON.parse(output)}catch(error){const raw=document.getElementById("rawOutput");raw.style.display="block";raw.textContent=output;showError("Python returned invalid JSON.");return}if(data.success===false){showError(JSON.stringify(data,null,2));return}const articles=Array.isArray(data.articles)?data.articles:[];const container=document.getElementById("articles");container.innerHTML="";if(!articles.length){container.innerHTML='<div class="loading">No Lemmy posts found.</div>';setStatus("No posts received.");return}articles.forEach(function(article){const box=document.createElement("article");box.className="article";const heading=document.createElement("h2");const title=document.createElement("a");title.textContent=article.title||"Untitled Lemmy post";title.href=article.url||"#";title.target="_blank";title.rel="noopener noreferrer";heading.appendChild(title);box.appendChild(heading);const imageUrl=typeof article.image_url==="string"?article.image_url.trim():"";if(imageUrl){const image=document.createElement("img");image.className="article-image";image.src=imageUrl;image.alt=article.title||"Lemmy image";image.loading="lazy";image.referrerPolicy="no-referrer";image.onclick=function(){window.open(imageUrl,"_blank","noopener,noreferrer")};image.onerror=function(){image.remove()};box.appendChild(image)}const description=typeof article.description==="string"?article.description.trim():"";if(description){const text=document.createElement("div");text.className="description";text.textContent=description;box.appendChild(text)}const meta=document.createElement("div");meta.className="meta";meta.textContent=[article.community&&"Community: "+article.community,article.author&&"Author: "+article.author,article.published&&"Published: "+article.published].filter(Boolean).join(" • ");box.appendChild(meta);if(typeof article.url==="string"&&article.url.trim()){const link=document.createElement("a");link.className="button";link.href=article.url.trim();link.target="_blank";link.rel="noopener noreferrer";link.textContent="Open";box.appendChild(link)}container.appendChild(box)});setStatus("Received "+articles.length+" Lemmy posts.")}
document.getElementById("categorySelect").addEventListener("change",function(event){if(event.target.value)requestFeed(event.target.value,document.getElementById("searchInput").value.trim())});document.getElementById("searchForm").addEventListener("submit",function(event){event.preventDefault();const term=document.getElementById("searchInput").value.trim();if(term)requestFeed(ALL_RSS_URL,term)});
async function loadPythonAndRequestFeed(){setStatus("Connected to YAN1 app. Loading python.py...");try{const response=await fetch("python.py");if(!response.ok)throw new Error("Could not load python.py.\nHTTP status: "+response.status);pythonCodeTemplate=await response.text();if(!pythonCodeTemplate.trim())throw new Error("python.py is empty.");requestFeed(randomCategoryFeed(),"")}catch(error){showError(error.message||String(error))}}loadPythonAndRequestFeed();
</script>
</body>
</html>
