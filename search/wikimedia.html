<!DOCTYPE html>
<html>

<head>

<title>YAN1 Wikimedia Search</title>

<meta name="viewport" content="width=device-width,initial-scale=1">


<style>

*,
*::before,
*::after{
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#f4f4f4;
    margin:0;
}


header{
    background:#1565c0;
    color:white;
    padding:15px;
    text-align:center;
}


.top{
    background:white;
    padding:15px;
    text-align:center;
}


#more{

    padding:10px 25px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;

}



#results{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));
    gap:12px 0;
    width:100%;
    padding:0;

}



.card{

    background:white;
    padding:15px;
    border-radius:0;
    box-shadow:none;

}



.card img,
.card video{

    width:100%;
    height:220px;
    object-fit:contain;

}



.card audio{

    width:100%;

}



#loading{

    text-align:center;
    padding:20px;
    font-size:18px;

}


</style>

  <script src="../app-launch.js" defer></script>
</head>


<body>


<header>

<h2>YAN1 Wikimedia Search</h2>

</header>



<div class="top">

<button id="more" onclick="openWikimedia()">
More
</button>

</div>



<div id="results"></div>

<div id="loading"></div>





<script>

let searchText="";

let loading=false;

let finished=false;

let offset=0;

let loadedIds=new Set();





// Receive search text from parent index2.html

window.addEventListener(
"message",
function(event){


let text=event.data;


if(
typeof text==="string" &&
text.trim()!==""
){


searchText=text.trim();


offset=0;

loading=false;

finished=false;

loadedIds.clear();


document
.getElementById("results")
.innerHTML="";


loadWikimedia();


}


});









async function loadWikimedia(){



if(loading || finished){

return;

}



loading=true;


document
.getElementById("loading")
.innerHTML="Loading...";



let cacheKey =
"wikimedia_cache_"
+
searchText
+
"_"
+
offset;



let data;



let cache =
localStorage.getItem(cacheKey);



if(cache){


data=JSON.parse(cache);


}

else{


let url =

"https://commons.wikimedia.org/w/api.php?"

+

"action=query"

+

"&generator=search"

+

"&gsrsearch="

+

encodeURIComponent(searchText)

+

"&gsrnamespace=6"

+

"&gsrlimit=12"

+

"&gsroffset="

+

offset

+

"&prop=imageinfo"

+

"&iiprop=url|mime|mediatype"

+

"&iiurlwidth=500"

+

"&format=json"

+

"&origin=*";



try{


let response =
await fetch(url);


data =
await response.json();



localStorage.setItem(
cacheKey,
JSON.stringify(data)
);



}

catch(error){


console.log(error);

loading=false;

return;


}



}






displayResults(data);




// IMPORTANT: Wikimedia next offset

if(data.continue && data.continue.gsroffset){

    offset = data.continue.gsroffset;

}
else{

    finished = true;

}




loading=false;

if(!finished){

    document
    .getElementById("loading")
    .innerHTML="";

}



}









function displayResults(data){



if(
!data.query ||
!data.query.pages
){

return;

}



let html="";



Object.values(data.query.pages)

.forEach(file=>{


if(
loadedIds.has(file.pageid)
){

return;

}


loadedIds.add(file.pageid);



if(
!file.imageinfo
){

return;

}



let info =
file.imageinfo[0];


let preview =
info.thumburl || info.url;



let media="";



if(
info.mediatype==="BITMAP"
){


media=

`
<img
loading="lazy"
src="${preview}">
`;


}



else if(
info.mediatype==="VIDEO"
){


media=

`
<video
controls
preload="none"
poster="${preview}">

<source src="${info.url}">

</video>
`;



}



else if(
info.mediatype==="AUDIO"
){


media=

`
<audio controls>

<source src="${info.url}">

</audio>
`;



}



else{


media=

`
<a href="${info.url}" target="_blank">
Open File
</a>
`;



}





html+=

`
<div class="card">

<h3>
${file.title.replace("File:","")}
</h3>

${media}

</div>

`;



});




document
.getElementById("results")
.insertAdjacentHTML(
"beforeend",
html
);



}









// Infinite scrolling

// Infinite scrolling

let scrollTimer = null;

window.addEventListener("scroll", function(){

    clearTimeout(scrollTimer);

    scrollTimer = setTimeout(function(){

        if(
            window.innerHeight + window.scrollY >=
            document.documentElement.scrollHeight - 300
        ){

            loadWikimedia();

        }

    },200);

});









function openWikimedia(){


if(!searchText){

return;

}



let url =

"https://commons.wikimedia.org/w/index.php?search="

+

encodeURIComponent(searchText)

+

"&title=Special:MediaSearch";



window.open(url,"_blank");


}




</script>

<script>
<script src="yan1-app.js"></script>


</body>

</html>
