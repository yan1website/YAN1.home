<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>GitHub Repository Search</title>


<style>

*,
*::before,
*::after{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:24px;
}

.container{

    width:100%;
    max-width:1000px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);

}


h1{

    text-align:center;
    color:#24292f;

}



#resultCount{

    margin-bottom:15px;
    color:#555;
    font-weight:bold;

}



.card{

    border:1px solid #ddd;
    border-radius:8px;
    background:#fafafa;
    padding:15px;
}


.card a:hover{

    text-decoration:underline;

}


.loading{

    text-align:center;
    padding:20px;

}



button{

    padding:12px 20px;
    border:none;
    border-radius:5px;
    background:#24292f;
    color:white;
    cursor:pointer;

}



button:hover{

    background:#000;

}

@media (max-width:600px){
    body{
        padding:0;
    }

    .container{
        padding:16px;
        border-radius:0;
    }
}


</style>


</head>



<body>


<div class="container">


<h1>
GitHub Repository Search
</h1>



<div id="resultCount"></div>


<div id="result"></div>



</div>







<script>



const result=document.getElementById("result");

const resultCount=document.getElementById("resultCount");



let currentQuery="";

let currentPage=1;

const perPage=50;








// Receive search text from index2.html

window.addEventListener(

"message",

function(event){



let text=event.data;



if(

typeof text==="string"

&&

text.trim()!==""

){



currentQuery=text.trim();

currentPage=1;


result.innerHTML="";


resultCount.innerHTML="Searching...";


loadRepositories();



}



});









function searchRepositories(text){
    currentQuery=text.trim();
    currentPage=1;
    result.innerHTML="";
    resultCount.innerHTML="Searching...";
    loadRepositories();
}


async function loadRepositories(){


try{


const response=await fetch(

"https://api.github.com/search/repositories?q="

+

encodeURIComponent(currentQuery)

+

"&per_page="

+

perPage

+

"&page="

+

currentPage,

{

headers:{

"Accept":"application/vnd.github.mercy-preview+json"

}

}

);



const data=await response.json();






if(!data.items || data.items.length===0){


resultCount.innerHTML=

"No more repositories.";


removeMoreButton();


return;


}





if(currentPage===1){


resultCount.innerHTML=

"Showing "

+

data.items.length

+

" repositories (Total found: "

+

data.total_count

+

")";


}







data.items.forEach(function(repo){



result.innerHTML +=`



<div class="card">


<h2>

${repo.full_name}

</h2>



<p>

${repo.description || "No description available."}

</p>



<strong>

Repository URL:

</strong>

<br>


<a href="viewer.html?url=${encodeURIComponent(repo.html_url)}">

${repo.html_url}

</a>


<br><br>



<strong>

Website URL:

</strong>

<br>


${

repo.homepage

?

`<a href="${repo.homepage}" target="_blank">

${repo.homepage}

</a>`

:

"No website available"

}



<br><br>



⭐ Stars: ${repo.stargazers_count}

<br>

🍴 Forks: ${repo.forks_count}

<br>

📝 Language: ${repo.language || "Unknown"}

<br>

👤 Owner: ${repo.owner.login}

<br><br>




<strong>

🎮 Platform / Topics:

</strong>

<br>



${

repo.topics && repo.topics.length

?

repo.topics.join(", ")

:

"Not specified"

}



<br><br>



<strong>

📜 License:

</strong>

<br>



${

repo.license

?

repo.license.name

:

"No license"

}




<br><br>



<strong>

🕒 Last Updated:

</strong>

<br>



${new Date(repo.updated_at).toLocaleDateString()}



</div>



`;



});






removeMoreButton();





if(data.items.length===perPage){


result.insertAdjacentHTML(

"beforeend",

`

<div id="moreBox" style="text-align:center;margin:20px;">


<button onclick="loadMore()">

Show More

</button>


</div>

`

);



}



}

catch(error){


console.error(error);


resultCount.innerHTML=

"Failed to connect to GitHub.";


}



}








function loadMore(){


currentPage++;


removeMoreButton();


loadRepositories();


}







function removeMoreButton(){


const box=document.getElementById("moreBox");


if(box){

box.remove();

}


}



</script>

<script>
<script src="yan1-app.js"></script>


</body>

</html>
