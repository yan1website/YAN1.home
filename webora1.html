<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#111111">
	<title>Webora</title>
	<script src="app-launch.js" defer></script>
	<style>
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; padding: 28px 16px 44px; background: #111; color: #fff; font-family: Arial, sans-serif; }
		main { width: min(100%, 900px); margin: 0 auto; }
		h1 { margin: 0 0 18px; font-size: 30px; }
		#searchForm { display: flex; gap: 8px; margin: 0 0 18px; }
		#searchInput { flex: 1; min-width: 0; min-height: 46px; padding: 10px 12px; border: 1px solid #555; border-radius: 6px; background: #1b1b1b; color: #fff; font: inherit; }
		#searchForm button, #loadMore { min-height: 46px; padding: 10px 18px; border: 0; border-radius: 6px; background: #fff; color: #111; font: inherit; cursor: pointer; }
		#searchForm button:hover, #loadMore:hover { background: #ddd; }
		#status { margin: 0 0 16px; padding: 12px; border-radius: 8px; background: #222; color: #ccc; text-align: center; }
		#status.error { color: #ff7777; }
		#results { display: grid; gap: 20px; }
		.entry { padding: 16px; border: 1px solid #333; border-radius: 10px; background: #1a1a1a; }
		.entry-image { display: block; width: 100%; max-height: 640px; object-fit: contain; border-radius: 6px; background: #080808; cursor: zoom-in; }
		.entry-image[hidden] { display: none; }
		.entry-links { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 14px; }
		.entry-links a { color: #9bcaff; overflow-wrap: anywhere; }
		.entry-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
		.share-button { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border: 1px solid #555; border-radius: 50%; background: #252525; color: #fff; cursor: pointer; }
		.share-button:hover { background: #3a3a3a; }
		.share-button svg { width: 20px; height: 20px; fill: currentColor; }
		.entry-keywords { margin: 14px 0 0; line-height: 1.5; overflow-wrap: anywhere; }
		.entry-keywords:empty { display: none; }
		#loadMore { display: block; margin: 20px auto 0; }
		#loadMore[hidden] { display: none; }
		#loadMore:disabled { cursor: wait; opacity: .7; }
		#imageViewer { position: fixed; inset: 0; width: 100%; max-width: none; height: 100%; max-height: none; margin: 0; padding: 56px 16px 16px; border: 0; background: #000; }
		#imageViewer::backdrop { background: #000; }
		#fullscreenImage { display: block; width: 100%; height: 100%; object-fit: contain; }
		#closeImageViewer { position: absolute; top: 12px; right: 16px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: #333; color: #fff; font-size: 28px; cursor: pointer; }
		#closeImageViewer:hover { background: #555; }
		@media (max-width: 520px) {
			body { padding: 22px 10px 36px; }
			h1 { font-size: 26px; }
			.entry { padding: 12px; }
		}
	</style>
</head>
<body>
	<main>
		<h1>Webora</h1>
		<form id="searchForm" role="search">
			<input id="searchInput" type="search" placeholder="Search keywords" aria-label="Search keywords" autocomplete="off">
			<button type="submit">Search</button>
		</form>
		<p id="status" role="status" aria-live="polite">Loading sheet data…</p>
		<section id="results" aria-label="Sheet results" hidden></section>
		<button id="loadMore" type="button" hidden>Load more</button>
	</main>
	<dialog id="imageViewer" aria-label="Fullscreen image viewer">
		<button id="closeImageViewer" type="button" aria-label="Close fullscreen image">×</button>
		<img id="fullscreenImage" alt="">
	</dialog>
	<script>
		const SPREADSHEET_ID = '1SvT6r0OPUvPXpIbduRFzO12gN_M9qG8PT5kgnw5nEzw';
		const PAGE_SIZE = 5;
		const statusBox = document.querySelector('#status');
		const results = document.querySelector('#results');
		const searchForm = document.querySelector('#searchForm');
		const searchInput = document.querySelector('#searchInput');
		const loadMoreButton = document.querySelector('#loadMore');
		const imageViewer = document.querySelector('#imageViewer');
		const fullscreenImage = document.querySelector('#fullscreenImage');
		const closeImageViewer = document.querySelector('#closeImageViewer');
		let entries = [];
		let rowCount = 0;
		let nextOffset = 0;
		let isLoading = false;
		let isSearching = false;

		function queryUrl(query) {
			const params = new URLSearchParams({ tqx: 'out:json', headers: '0', range: 'A:D', tq: query });
			return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params}`;
		}

		async function runQuery(query) {
			const response = await fetch(queryUrl(query), { cache: 'no-store' });
			if (!response.ok) throw new Error(`Google Sheet request failed (${response.status}).`);
			const text = await response.text();
			const start = text.indexOf('{');
			const end = text.lastIndexOf('}');
			if (start < 0 || end < start) throw new Error('The Google Sheet returned an invalid response.');
			const data = JSON.parse(text.slice(start, end + 1));
			if (data.status !== 'ok') throw new Error(data.errors?.[0]?.detailed_message || 'The Google Sheet query failed.');
			return data.table;
		}

		function cellValue(cell) {
			return String(cell?.v ?? cell?.f ?? '').trim();
		}

		function rowValues(row) {
			return [0, 1, 2, 3].map((index) => cellValue(row.c?.[index]));
		}

		function showStatus(message, isError = false) {
			statusBox.textContent = message;
			statusBox.classList.toggle('error', isError);
			statusBox.hidden = false;
		}

		function openImageViewer(image) {
			fullscreenImage.src = image.src;
			fullscreenImage.alt = image.alt;
			imageViewer.showModal();
		}

		async function shareEntry(imageUrl, keywords) {
			const shareUrl = new URL('https://yan1website.github.io/YAN1.home/index.html?webora2.html');
			shareUrl.searchParams.set('txt', imageUrl);
			const shareBody = [
				'YAN1 APP GEN 1',
				'YAN1 APP GEN 1',
				'Found something interesting — have a look! ✨',
				`🌐 ${keywords}`,
				'THANKS 🙏'
			].join('\n');
			const shareText = `${shareBody}\n${shareUrl.href}`;

			try {
				if (navigator.share) {
					await navigator.share({ title: 'YAN1 APP GEN 1', text: shareBody, url: shareUrl.href });
				} else if (navigator.clipboard && window.isSecureContext) {
					await navigator.clipboard.writeText(shareText);
					alert('Share message copied.');
				} else {
					window.prompt('Copy this message to share:', shareText);
				}
			} catch (error) {
				if (error.name !== 'AbortError') window.prompt('Copy this message to share:', shareText);
			}
		}

		closeImageViewer.addEventListener('click', () => imageViewer.close());
		imageViewer.addEventListener('click', (event) => {
			if (event.target === imageViewer) imageViewer.close();
		});

		function createEntryCard(entry) {
			const [imageUrl, keywords, link1, link2] = entry;
			const card = document.createElement('article');
			card.className = 'entry';

			if (/^https?:\/\//i.test(imageUrl)) {
				const image = document.createElement('img');
				image.className = 'entry-image';
				image.src = imageUrl;
				image.alt = keywords ? `Image: ${keywords}` : 'Sheet image';
				image.loading = 'lazy';
				image.tabIndex = 0;
				image.setAttribute('role', 'button');
				image.setAttribute('aria-label', `View ${image.alt} fullscreen`);
				image.addEventListener('click', () => openImageViewer(image));
				image.addEventListener('keydown', (event) => {
					if (event.key === 'Enter' || event.key === ' ') {
						event.preventDefault();
						openImageViewer(image);
					}
				});
				image.addEventListener('error', () => {
					image.hidden = true;
				}, { once: true });
				card.append(image);
			}

			const links = document.createElement('div');
			links.className = 'entry-links';
			[[link1, 'Link1'], [link2, 'Link2']].forEach(([url, label]) => {
				if (!/^https?:\/\//i.test(url)) return;
				const link = document.createElement('a');
				link.href = url;
				link.target = '_blank';
				link.rel = 'noopener noreferrer';
				link.textContent = label;
				links.append(link);
			});
			if (links.childElementCount) card.append(links);

			const actions = document.createElement('div');
			actions.className = 'entry-actions';
			const shareButton = document.createElement('button');
			shareButton.className = 'share-button';
			shareButton.type = 'button';
			shareButton.setAttribute('aria-label', 'Share this entry');
			shareButton.title = 'Share';
			shareButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.3 3.3 0 0 0 0-1.39l7.05-4.11A3 3 0 1 0 15 5c0 .23.03.46.08.68L8.03 9.79a3 3 0 1 0 0 4.42l7.12 4.16a3 3 0 1 0 2.85-2.29Z"/></svg>';
			shareButton.addEventListener('click', () => shareEntry(imageUrl, keywords));
			actions.append(shareButton);
			card.append(actions);

			const keywordText = document.createElement('p');
			keywordText.className = 'entry-keywords';
			keywordText.textContent = keywords;
			card.append(keywordText);
			return card;
		}

		function appendEntries(newEntries) {
			newEntries.forEach((entry) => results.append(createEntryCard(entry)));
			results.hidden = false;
			statusBox.hidden = true;
		}

		function levenshteinDistance(left, right) {
			let previous = Array.from({ length: right.length + 1 }, (_, index) => index);
			for (let i = 1; i <= left.length; i += 1) {
				const current = [i];
				for (let j = 1; j <= right.length; j += 1) {
					current[j] = Math.min(
						current[j - 1] + 1,
						previous[j] + 1,
						previous[j - 1] + (left[i - 1] === right[j - 1] ? 0 : 1)
					);
				}
				previous = current;
			}
			return previous[right.length];
		}

		function keywordScore(query, keywords) {
			const text = keywords.toLowerCase();
			if (!text) return 0;
			if (text === query) return 100;
			if (text.includes(query)) return 80;

			const queryWords = query.split(/\s+/).filter(Boolean);
			const textWords = text.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
			let score = queryWords.reduce((total, word) => {
				if (textWords.some((candidate) => candidate.startsWith(word))) return total + 12;
				const closeMatch = textWords.some((candidate) => {
					const maxDistance = word.length > 5 ? 2 : 1;
					return Math.abs(candidate.length - word.length) <= maxDistance
						&& levenshteinDistance(word, candidate) <= maxDistance;
				});
				return total + (closeMatch ? 7 : 0);
			}, 0);
			if (queryWords.length && queryWords.every((word) => text.includes(word))) score += 20;
			return score;
		}

		async function loadNextPage() {
			if (isLoading || isSearching || nextOffset >= rowCount) return;
			isLoading = true;
			loadMoreButton.disabled = true;
			loadMoreButton.textContent = 'Loading…';
			showStatus('Loading more rows…');
			try {
				const table = await runQuery(`select * where A is not null limit ${PAGE_SIZE} offset ${nextOffset}`);
				const pageEntries = (table.rows || [])
					.map(rowValues)
					.filter((row) => row.some((value) => value !== ''));
				entries.push(...pageEntries);
				nextOffset += (table.rows || []).length;
				appendEntries(pageEntries);
				loadMoreButton.hidden = nextOffset >= rowCount;
				if (loadMoreButton.hidden) showStatus('All rows loaded.');
			} catch (error) {
				showStatus(error.message || 'Unable to load more rows from the Google Sheet.', true);
			} finally {
				isLoading = false;
				loadMoreButton.disabled = false;
				loadMoreButton.textContent = 'Load more';
			}
		}

		loadMoreButton.addEventListener('click', loadNextPage);

		if ('IntersectionObserver' in window) {
			const loadObserver = new IntersectionObserver((observedEntries) => {
				if (observedEntries.some((entry) => entry.isIntersecting)) loadNextPage();
			}, { rootMargin: '300px' });
			loadObserver.observe(loadMoreButton);
		}

		searchForm.addEventListener('submit', async (event) => {
			event.preventDefault();
			const query = searchInput.value.trim().toLowerCase();
			if (!query) {
				showStatus('Enter keywords to search.', true);
				return;
			}

			isSearching = true;
			loadMoreButton.hidden = true;
			showStatus('Searching all sheet rows…');
			try {
				if (entries.length < rowCount) {
					const table = await runQuery('select * where A is not null');
					entries = (table.rows || [])
						.map(rowValues)
						.filter((row) => row.some((value) => value !== ''));
				}
				const matches = entries
					.map((entry) => ({ entry, score: keywordScore(query, entry[1]) }))
					.filter((match) => match.score > 0)
					.sort((left, right) => right.score - left.score)
					.map((match) => match.entry);
				results.replaceChildren();
				if (!matches.length) {
					results.hidden = true;
					showStatus('No matching or similar keywords were found.');
					return;
				}
				const title = document.createElement('h2');
				title.textContent = `${matches.length} matching result${matches.length === 1 ? '' : 's'}`;
				results.append(title);
				appendEntries(matches);
			} catch (error) {
				showStatus(error.message || 'Unable to search the Google Sheet.', true);
			} finally {
				isSearching = false;
			}
		});

		async function loadFirstPage() {
			try {
				const countTable = await runQuery('select count(A) where A is not null');
				rowCount = Number(countTable.rows?.[0]?.c?.[0]?.v);
				if (!Number.isInteger(rowCount) || rowCount < 1) {
					showStatus('No non-empty rows were found in column A.', true);
					return;
				}
				await loadNextPage();
			} catch (error) {
				showStatus(error.message || 'Unable to load data from the Google Sheet.', true);
			}
		}

		loadFirstPage();
	</script>
</body>
</html>
