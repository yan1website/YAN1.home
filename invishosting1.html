<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#111111">
	<title>InvisHosting</title>
	<style>
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; padding: 28px 16px 44px; overflow-x: hidden; background: #111; color: #fff; font-family: Arial, sans-serif; }
		main { width: min(100%, 1100px); margin: 0 auto; }
		#searchForm { display: flex; gap: 8px; margin: 0 0 18px; }
		#searchInput { flex: 1; min-width: 0; min-height: 46px; padding: 10px 12px; border: 1px solid #555; border-radius: 6px; background: #1b1b1b; color: #fff; font: inherit; }
		#searchForm button { min-height: 46px; padding: 10px 18px; border: 0; border-radius: 6px; background: #fff; color: #111; font: inherit; cursor: pointer; }
		#searchForm button:hover { background: #ddd; }
		#status { min-height: 1.5em; margin: 0 0 16px; padding: 12px; border-radius: 8px; background: #222; color: #ccc; text-align: center; }
		#status.error { color: #ff7777; }
		#files { display: flex; flex-direction: column; gap: 24px; }
		.file-entry { min-width: 0; }
		.file-title { margin: 0 0 12px; color: #fff; font-size: 22px; line-height: 1.35; overflow-wrap: anywhere; }
		.file-preview { display: block; width: 100%; max-width: 100%; height: 100vh; height: 100svh; min-height: 600px; border: 0; border-radius: 8px; background: #000; }
		.share-actions { display: flex; justify-content: center; margin-top: 16px; }
		.share-button { min-height: 44px; padding: 10px 20px; border: 0; border-radius: 7px; background: #fff; color: #111; font: inherit; cursor: pointer; }
		.share-button:hover { background: #ddd; }
		#sentinel { height: 1px; }
		#endMessage { display: none; margin: 20px 0; color: #888; text-align: center; }
		@media (max-width: 520px) { body { padding: 22px 10px 36px; } .file-preview { min-height: 520px; } }
	</style>
	<script src="app-launch.js" defer></script>
</head>
<body>
	<main>
		<form id="searchForm" role="search">
			<input id="searchInput" type="search" placeholder="Search column O" aria-label="Search column O" autocomplete="off">
			<button type="submit">Search</button>
		</form>
		<p id="status" role="status" aria-live="polite">Loading files…</p>
		<section id="files" aria-label="Files from the Google Sheet"></section>
		<div id="sentinel" aria-hidden="true"></div>
		<p id="endMessage">You’ve reached the end of the sheet.</p>
	</main>
	<script>
		const SPREADSHEET_ID = '1qkFOAcrXXBjbAJoHLorSyTXMpPrRfBoX5DDGGstiP8M';
		const PAGE_SIZE = 5;
		const statusBox = document.querySelector('#status');
		const filesContainer = document.querySelector('#files');
		const sentinel = document.querySelector('#sentinel');
		const endMessage = document.querySelector('#endMessage');
		const searchForm = document.querySelector('#searchForm');
		const searchInput = document.querySelector('#searchInput');
		let offset = 0;
		let loading = false;
		let exhausted = false;
		let searchTerm = '';
		let requestVersion = 0;

		function queryUrl(query) {
			const params = new URLSearchParams({ tqx: 'out:json', range: 'N:O', tq: query });
			return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params}`;
		}

		async function runQuery(query) {
			const response = await fetch(queryUrl(query), { cache: 'no-store' });
			if (!response.ok) throw new Error(`Google Sheet request failed (${response.status}).`);
			const text = await response.text();
			const start = text.indexOf('{');
			const end = text.lastIndexOf('}');
			if (start < 0 || end < start) throw new Error('The Google Sheet returned an invalid response.');
			const data = JSON.parse(text.slice(start, end + 1));
			if (data.status !== 'ok') throw new Error(data.errors?.[0]?.detailed_message || 'The Google Sheet query failed.');
			return data.table;
		}

		function escapeQueryValue(value) {
			return value.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
		}

		function makeFileUrl(value) {
			return /^https?:\/\//i.test(value)
				? new URL(value)
				: new URL(`https://invishosting.com/view.php?id=${encodeURIComponent(value)}`);
		}

		async function shareEntry(linkValue, noteValue) {
			const shareUrl = new URL('https://yan1website.github.io/YAN1.home/invishosting2.html');
			shareUrl.searchParams.set('txt', linkValue);
			const shareText = [
				'YAN1 APP GEN 1',
				'YAN1 APP GEN 1',
				'Found something interesting — have a look! ✨',
				`▰▰▱  ${noteValue}`,
				'THANKS 🙏'
			].join('\n');
			const fullMessage = `${shareText}\n\n${shareUrl.href}`;

			try {
				if (navigator.share) {
					await navigator.share({ title: 'YAN1 APP GEN 1', text: shareText, url: shareUrl.href });
				} else if (navigator.clipboard && window.isSecureContext) {
					await navigator.clipboard.writeText(fullMessage);
					alert('Share message copied.');
				} else {
					window.prompt('Copy this message to share:', fullMessage);
				}
			} catch (error) {
				if (error.name !== 'AbortError') window.prompt('Copy this message to share:', fullMessage);
			}
		}

		function renderRow(row, rowNumber) {
			const linkValue = String(row.c?.[0]?.v ?? '').trim();
			const noteValue = String(row.c?.[1]?.f ?? row.c?.[1]?.v ?? '').trim();			
			if (!linkValue) return;
			const fileUrl = makeFileUrl(linkValue);
			const isPdf = /\.pdf$/i.test(fileUrl.pathname) || noteValue.replace(/^\./, '').toLowerCase() === 'pdf';
			const viewerUrl = isPdf
				? `https://docs.google.com/gview?url=${encodeURIComponent(fileUrl.href)}&embedded=true`
				: fileUrl.href;
			const entry = document.createElement('article');
			entry.className = 'file-entry';
			entry.setAttribute('aria-label', `File ${rowNumber}`);

			if (noteValue) {
				const title = document.createElement('h2');
				title.className = 'file-title';
				title.textContent = noteValue;
				entry.appendChild(title);
			}

			const preview = document.createElement('iframe');
			preview.className = 'file-preview';
			preview.title = noteValue ? `${noteValue} preview` : `File ${rowNumber} preview`;
			preview.referrerPolicy = 'no-referrer';
			preview.loading = 'lazy';
			preview.src = viewerUrl;
			entry.appendChild(preview);

			const actions = document.createElement('div');
			actions.className = 'share-actions';
			const shareButton = document.createElement('button');
			shareButton.className = 'share-button';
			shareButton.type = 'button';
			shareButton.textContent = 'Share';
			shareButton.addEventListener('click', () => shareEntry(linkValue, noteValue));
			actions.appendChild(shareButton);
			entry.appendChild(actions);
			filesContainer.appendChild(entry);
		}

		async function loadNextBatch() {
			if (loading || exhausted) return;
			loading = true;
			const version = requestVersion;
			statusBox.classList.remove('error');
			statusBox.hidden = false;
			statusBox.textContent = offset === 0 ? 'Loading files…' : 'Loading more files…';
			try {
				const condition = searchTerm
					? `N is not null and lower(O) contains '${escapeQueryValue(searchTerm)}'`
					: 'N is not null';
				const table = await runQuery(`select N, O where ${condition} limit ${PAGE_SIZE} offset ${offset}`);
				if (version !== requestVersion) return;
				const rows = table.rows || [];
				const batchOffset = offset;
				offset += rows.length;
				rows.forEach((row, index) => renderRow(row, batchOffset + index + 1));
				if (rows.length < PAGE_SIZE) {
					exhausted = true;
					statusBox.hidden = offset > 0;
					if (offset === 0) statusBox.textContent = searchTerm ? 'No matching text found in column O.' : 'No files were found in columns N and O.';
					endMessage.style.display = offset > 0 ? 'block' : 'none';
				} else {
					statusBox.hidden = true;
				}
			} catch (error) {
				if (version !== requestVersion) return;
				statusBox.textContent = error.message || 'Unable to load files from the sheet.';
				statusBox.classList.add('error');
			} finally {
				if (version === requestVersion) loading = false;
			}
		}

		searchForm.addEventListener('submit', (event) => {
			event.preventDefault();
			requestVersion += 1;
			loading = false;
			offset = 0;
			exhausted = false;
			searchTerm = searchInput.value.trim().toLowerCase();
			filesContainer.replaceChildren();
			endMessage.style.display = 'none';
			statusBox.hidden = false;
			statusBox.classList.remove('error');
			loadNextBatch();
		});

		new IntersectionObserver((entries) => {
			if (entries.some((entry) => entry.isIntersecting)) loadNextBatch();
		}, { rootMargin: '500px 0px' }).observe(sentinel);
		loadNextBatch();
	</script>
</body>
</html>
