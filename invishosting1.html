<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>InvisHosting Files</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 28px 16px 44px; background: #111; color: #fff; font-family: Arial, sans-serif; }
    main { width: min(100%, 1100px); margin: 0 auto; }
    h1 { margin: 0 0 8px; text-align: center; font-size: clamp(26px, 5vw, 38px); }
    .intro { margin: 0 0 22px; color: #aaa; text-align: center; line-height: 1.5; }
    #status { min-height: 1.5em; margin: 0 0 16px; padding: 12px; border-radius: 8px; background: #222; color: #ccc; text-align: center; }
    #status.error { color: #ff7777; }
    #files { display: grid; gap: 18px; }
    .file-card { min-width: 0; padding: 16px; border: 1px solid #333; border-radius: 12px; background: #1b1b1b; }
    .file-title { margin: 0 0 12px; color: #ddd; font-size: 14px; }
    .preview { display: block; width: 100%; max-height: 72vh; background: #000; }
    .preview[hidden] { display: none; }
    video { height: auto; }
    img { height: auto; object-fit: contain; }
    audio { max-width: 100%; }
    iframe { height: 68vh; min-height: 360px; border: 0; }
    .file-actions { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .file-actions a, .share-button { display: inline-flex; justify-content: center; align-items: center; min-height: 42px; padding: 9px 15px; border: 0; border-radius: 7px; background: #fff; color: #111; font: inherit; text-decoration: none; cursor: pointer; }
    .file-actions a:hover, .share-button:hover { background: #ddd; }
    .share-button { min-width: 46px; font-size: 20px; }
    #sentinel { height: 1px; }
    #endMessage { display: none; margin: 20px 0; color: #888; text-align: center; }
    @media (max-width: 520px) { body { padding: 22px 10px 36px; } .file-card { padding: 11px; } }
  </style>
  <script src="app-launch.js" defer></script>
</head>
<body>
  <main>
    <h1>InvisHosting Files</h1>
    <p class="intro">Files load in groups of 10 as you scroll down.</p>
    <p id="status" role="status" aria-live="polite">Loading the first files…</p>
    <section id="files" aria-label="Files from the Google Sheet"></section>
    <div id="sentinel" aria-hidden="true"></div>
    <p id="endMessage">You’ve reached the end of the sheet.</p>
  </main>
  <script>
    const SPREADSHEET_ID = '1qkFOAcrXXBjbAJoHLorSyTXMpPrRfBoX5DDGGstiP8M';
    const PAGE_SIZE = 10;
    const statusBox = document.querySelector('#status');
    const filesContainer = document.querySelector('#files');
    const sentinel = document.querySelector('#sentinel');
    const endMessage = document.querySelector('#endMessage');
    let offset = 0;
    let loading = false;
    let exhausted = false;

    function sheetQueryUrl(offsetValue) {
      const params = new URLSearchParams({
        tqx: 'out:json',
        range: 'N:O',
        tq: `select * limit ${PAGE_SIZE} offset ${offsetValue}`
      });
      return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params}`;
    }

    async function fetchPage(offsetValue) {
      const response = await fetch(sheetQueryUrl(offsetValue), { cache: 'no-store' });
      if (!response.ok) throw new Error(`Google Sheet request failed (${response.status}).`);
      const text = await response.text();
      const start = text.indexOf('{');
      const end = text.lastIndexOf('}');
      if (start < 0 || end < start) throw new Error('The Google Sheet returned an invalid response.');
      const result = JSON.parse(text.slice(start, end + 1));
      if (result.status !== 'ok') throw new Error(result.errors?.[0]?.detailed_message || 'The sheet query failed.');
      return result.table;
    }

    function fileType(extension) {
      const ext = String(extension || '').trim().replace(/^\./, '').toLowerCase();
      if (/^(png|jpe?g|gif|webp|avif|svg|bmp|ico)$/.test(ext)) return 'image';
      if (/^(mp3|wav|ogg|oga|m4a|aac|flac|opus)$/.test(ext)) return 'audio';
      if (/^(mp4|m4v|webm|ogv|mov|m3u8|mpd)$/.test(ext)) return 'video';
      return ext ? 'document' : 'video';
    }

    function makeFileUrl(value) {
      return /^https?:\/\//i.test(value)
        ? value
        : `https://invishosting.com/view.php?id=${encodeURIComponent(value)}`;
    }

    function createViewer(type, url) {
      let viewer;
      if (type === 'image') {
        viewer = document.createElement('img');
        viewer.alt = 'File from InvisHosting';
      } else if (type === 'audio') {
        viewer = document.createElement('audio');
        viewer.controls = true;
        viewer.preload = 'metadata';
      } else if (type === 'document') {
        viewer = document.createElement('iframe');
        viewer.title = 'File preview';
      } else {
        viewer = document.createElement('video');
        viewer.controls = true;
        viewer.playsInline = true;
        viewer.preload = 'metadata';
      }
      viewer.className = 'preview';
      viewer.src = url;
      if (viewer.tagName === 'IFRAME') viewer.loading = 'lazy';
      return viewer;
    }

    async function shareFile(value) {
      const permanentLink = new URL('https://yan1website.github.io/YAN1.home/invishosting2.html');
      permanentLink.searchParams.set('txt', value);
      try {
        if (navigator.share) {
          await navigator.share({ title: 'InvisHosting file', url: permanentLink.href });
        } else if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(permanentLink.href);
          alert('Permanent link copied. You can share it in any app.');
        } else {
          window.prompt('Copy this permanent link to share:', permanentLink.href);
        }
      } catch (error) {
        if (error.name !== 'AbortError') window.prompt('Copy this permanent link to share:', permanentLink.href);
      }
    }

    function renderRow(row, rowNumber) {
      const value = String(row.c?.[0]?.v ?? '').trim();
      const extension = String(row.c?.[1]?.v ?? '').trim().replace(/^\./, '').toLowerCase();
      if (!value) return false;
      const url = makeFileUrl(value);
      const type = fileType(extension);
      const card = document.createElement('article');
      card.className = 'file-card';
      const heading = document.createElement('h2');
      heading.className = 'file-title';
      heading.textContent = `File ${rowNumber} · ${extension || type}`;
      card.append(heading, createViewer(type, url));

      const actions = document.createElement('div');
      actions.className = 'file-actions';
      const openLink = document.createElement('a');
      openLink.href = url;
      openLink.target = '_blank';
      openLink.rel = 'noopener noreferrer';
      openLink.textContent = 'Open file';
      const shareButton = document.createElement('button');
      shareButton.type = 'button';
      shareButton.className = 'share-button';
      shareButton.textContent = 'ᯓ➤';
      shareButton.setAttribute('aria-label', 'Share permanent file link');
      shareButton.title = 'Share permanent file link';
      shareButton.addEventListener('click', () => shareFile(value));
      actions.append(openLink, shareButton);
      card.appendChild(actions);
      filesContainer.appendChild(card);
      return true;
    }

    async function loadNextPage() {
      if (loading || exhausted) return;
      loading = true;
      statusBox.classList.remove('error');
      statusBox.textContent = offset === 0 ? 'Loading the first files…' : 'Loading more files…';
      try {
        const table = await fetchPage(offset);
        const rows = table.rows || [];
        rows.forEach((row, index) => renderRow(row, offset + index + 1));
        offset += rows.length;
        if (rows.length < PAGE_SIZE) {
          exhausted = true;
          endMessage.style.display = offset ? 'block' : 'none';
          statusBox.textContent = offset ? `Loaded all ${offset} sheet rows.` : 'No file rows were found in columns N and O.';
        } else {
          statusBox.textContent = `${offset} sheet rows loaded. Scroll down for more.`;
        }
      } catch (error) {
        statusBox.textContent = error.message || 'Unable to load files from the sheet.';
        statusBox.classList.add('error');
      } finally {
        loading = false;
      }
    }

    new IntersectionObserver((entries) => {
      if (entries.some((entry) => entry.isIntersecting)) loadNextPage();
    }, { rootMargin: '500px 0px' }).observe(sentinel);
    loadNextPage();
  </script>
</body>
</html>
