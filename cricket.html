<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Cricket Score</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d0d0d;
        color: white;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    header {
        text-align: center;
        padding: 15px 15px 10px;
        background: #1a1a1a;
        font-size: 22px;
        font-weight: bold;
        border-bottom: 2px solid #333;
        position: relative;
    }

    /* Tagline */
    .tagline {
        margin-top: 6px;
        font-size: 14px;
        font-weight: normal;
        color: #ffcc00;
        letter-spacing: 0.5px;
    }

    .container {
        width: 100%;
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    /* Loading Spinner */
    .loader {
        width: 45px;
        height: 45px;
        border: 5px solid #fff;
        border-top: 5px solid #ffcc00;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        position: absolute;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

</style>
    <script src="app-launch.js" defer></script>
</head>
<body>

<header>
    🏏 Live Cricket Scores
    <div class="tagline">Every ball. Every moment.</div>
</header>

<div class="container">
    <div class="loader" id="loader"></div>
    
    <iframe 
        id="liveFrame"
        src="https://widget.crictimes.org/" 
        loading="lazy">
    </iframe>
</div>

<script>
    const iframe = document.getElementById("liveFrame");
    const loader = document.getElementById("loader");

    // Hide loader once iframe loads
    iframe.onload = () => {
        loader.style.display = "none";
    };

    // Auto refresh iframe every 30 seconds (optional)
    setInterval(() => {
        iframe.src = iframe.src;
    }, 30000);
</script>

</body>
</html>
