<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Random Product</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #17221d;
			--muted: #65736b;
			--paper: #f5f1e8;
			--panel: #fffdf8;
			--accent: #d85d36;
			--accent-dark: #a93d20;
			--line: #ded8ca;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--ink);
			background:
				radial-gradient(circle at 10% 0%, #f9d9b9 0, transparent 34%),
				linear-gradient(135deg, var(--paper), #e4eee5);
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			width: min(100%, 1100px);
			padding: clamp(24px, 6vw, 56px);
			text-align: center;
			background: var(--panel);
			border: 1px solid rgba(222, 216, 202, .9);
			box-shadow: 0 24px 70px rgba(61, 54, 40, .14);
		}

		.eyebrow {
			margin: 0 0 10px;
			color: var(--accent-dark);
			font: 700 12px/1.2 Arial, sans-serif;
			letter-spacing: .16em;
			text-transform: uppercase;
		}

		h1 { margin: 0; font-size: clamp(32px, 7vw, 58px); line-height: 1; }

		#status {
			min-height: 24px;
			margin: 18px 0 26px;
			color: var(--muted);
			font: 15px/1.5 Arial, sans-serif;
		}

		#search-form {
			display: flex;
			gap: 10px;
			margin: 26px 0;
		}

		#search-input {
			min-width: 0;
			flex: 1;
			padding: 14px 16px;
			border: 1px solid var(--line);
			color: var(--ink);
			background: #fff;
			font: 16px/1.2 Arial, sans-serif;
		}

		#search-input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

		#products {
			display: grid;
			grid-template-columns: 1fr;
			gap: 28px;
			text-align: left;
		}

		.product {
			display: grid;
			gap: 14px;
			padding: 14px;
			border: 1px solid var(--line);
			background: #f9f6ee;
		}

		.product-media {
			width: 100%;
			height: min(78vh, 820px);
			overflow: hidden;
			background: #eeeae1;
		}

		.product-media img,
		.product-media iframe {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
			object-fit: contain;
		}

		.image-trigger {
			width: 100%;
			height: 100%;
			min-width: 0;
			padding: 0;
			background: transparent;
			color: inherit;
		}

		.image-trigger:hover:not(:disabled) {
			background: transparent;
			transform: none;
		}

		.image-trigger img { cursor: zoom-in; }

		.product button { width: 100%; }

		#load-more {
			margin-top: 24px;
		}

		button {
			min-width: 170px;
			padding: 14px 24px;
			border: 0;
			color: #fff;
			background: var(--accent);
			font: 700 15px/1 Arial, sans-serif;
			cursor: pointer;
			transition: background .2s ease, transform .2s ease;
		}

		button:hover:not(:disabled) { background: var(--accent-dark); transform: translateY(-2px); }
		button:disabled { cursor: wait; opacity: .55; }
		[hidden] { display: none !important; }

		.error { color: var(--accent-dark) !important; }

		@media (max-width: 560px) {
			#search-form { flex-direction: column; }
			#search-form button { width: 100%; }
		}

		#image-modal {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: grid;
			place-items: center;
			padding: 24px;
			background: rgba(12, 17, 14, .92);
		}

		#image-modal img {
			max-width: 96vw;
			max-height: 90vh;
			object-fit: contain;
		}

		#close-modal {
			position: fixed;
			top: 18px;
			right: 18px;
			min-width: 0;
			padding: 10px 16px;
			font-size: 24px;
			line-height: 1;
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">A little something to browse</p>
		<h1>Random Product</h1>
		<form id="search-form" role="search">
			<input id="search-input" type="search" placeholder="Search products" autocomplete="off">
			<button type="submit">Search</button>
		</form>
		<p id="status" aria-live="polite">Finding something for you...</p>

		<section id="products" aria-label="Products"></section>
		<button id="load-more" type="button">Load more</button>
	</main>

	<div id="image-modal" role="dialog" aria-modal="true" aria-label="Full-size product image" hidden>
		<button id="close-modal" type="button" aria-label="Close full-size image">&times;</button>
		<img id="modal-image" alt="Full-size product">
	</div>

	<script>
		const SPREADSHEET_ID = '1lNHUEVGVLIy43AhCSSi8AHkINszfA7iNubEsHUqdRKQ';
		const SHEET_NAME = 'Sheet1';

		const products = document.querySelector('#products');
		const status = document.querySelector('#status');
		const loadMoreButton = document.querySelector('#load-more');
		const searchForm = document.querySelector('#search-form');
		const searchInput = document.querySelector('#search-input');
		const imageModal = document.querySelector('#image-modal');
		const modalImage = document.querySelector('#modal-image');
		const closeModalButton = document.querySelector('#close-modal');
		const PAGE_SIZE = 12;
		let offset = 0;
		let totalRows = 0;
		let searchTerm = '';

		function sheetQueryUrl(query) {
			const params = new URLSearchParams({
				sheet: SHEET_NAME,
				tqx: 'out:json',
				tq: query
			});
			return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params}`;
		}

		function imageSource(url) {
			const match = url.match(/^https?:\/\/ibb\.co\/([^/?#]+)\/?(?:[?#].*)?$/i);
			if (!match) return url;

			const fullImageIds = {
				'5XdNzScH': 'ZR3nwFTD',
				'bVg3g2x': '7DJzJRH',
				'Txt5ZmDh': 'ZpxC3WRT',
				'0yzfcHxn': 'YBVt3HxN'
			};
			const fullImageId = fullImageIds[match[1]] || match[1];
			return `https://i.ibb.co/${fullImageId}/image.png`;
		}

		function escapeQueryText(value) {
			return value.replace(/'/g, "''");
		}

		async function querySheet(query) {
			const response = await fetch(sheetQueryUrl(query), { cache: 'no-store' });
			if (!response.ok) throw new Error(`Google Sheets request failed (${response.status})`);

			const text = await response.text();
			const start = text.indexOf('{');
			const end = text.lastIndexOf('}');
			if (start < 0 || end < start) throw new Error('Invalid Google Sheets response');

			const result = JSON.parse(text.slice(start, end + 1));
			if (result.status !== 'ok') {
				throw new Error(result.errors?.[0]?.detailed_message || 'The sheet query failed');
			}
			return result.table;
		}

		function addProduct(imageUrl, orderUrl) {
			const card = document.createElement('article');
			card.className = 'product';

			const media = document.createElement('div');
			media.className = 'product-media';

			const image = document.createElement('img');
			const fullImageUrl = imageSource(imageUrl);
			image.src = fullImageUrl;
			image.alt = 'Product';
			image.loading = 'lazy';
			image.addEventListener('error', () => {
				// Some hosts provide a page URL instead of a direct image URL.
				image.hidden = true;
				const frame = document.createElement('iframe');
				frame.src = imageUrl;
				frame.title = 'Product image page';
				frame.loading = 'lazy';
				media.appendChild(frame);
			}, { once: true });
			const imageButton = document.createElement('button');
			imageButton.type = 'button';
			imageButton.className = 'image-trigger';
			imageButton.setAttribute('aria-label', 'Open full-size product image');
			imageButton.appendChild(image);
			imageButton.addEventListener('click', () => {
				modalImage.src = fullImageUrl;
				imageModal.hidden = false;
				document.body.style.overflow = 'hidden';
				closeModalButton.focus();
			});
			media.appendChild(imageButton);

			const orderButton = document.createElement('button');
			orderButton.type = 'button';
			orderButton.textContent = 'Order now';
			orderButton.addEventListener('click', () => {
				window.open(orderUrl, '_blank', 'noopener,noreferrer');
			});

			card.append(media, orderButton);
			products.appendChild(card);
		}

		async function loadProducts() {
			loadMoreButton.disabled = true;
			status.classList.remove('error');
			status.textContent = offset ? 'Loading more products...' : 'Loading products...';

			try {
				if (!totalRows) {
					const searchClause = searchTerm ? ` and lower(C) contains '${escapeQueryText(searchTerm.toLowerCase())}'` : '';
					const countTable = await querySheet(`select count(A) where A is not null and B is not null${searchClause}`);
					totalRows = Number(countTable.rows?.[0]?.c?.[0]?.v || 0);
					if (!Number.isInteger(totalRows) || totalRows < 1) {
						throw new Error(searchTerm ? 'No matching products found.' : 'No image and order-link rows were found.');
					}
				}

				const searchClause = searchTerm ? ` and lower(C) contains '${escapeQueryText(searchTerm.toLowerCase())}'` : '';
				const selectedTable = await querySheet(
					`select A, B where A is not null and B is not null${searchClause} limit ${PAGE_SIZE} offset ${offset}`
				);

				(selectedTable.rows || []).forEach((row) => {
					const cells = row.c || [];
					const imageUrl = String(cells[0]?.v || '').trim();
					const orderUrl = String(cells[1]?.v || '').trim();
					if (/^https?:\/\//i.test(imageUrl) && /^https?:\/\//i.test(orderUrl)) {
						addProduct(imageUrl, orderUrl);
					}
				});

				offset += PAGE_SIZE;
				const loadedAll = offset >= totalRows || (selectedTable.rows || []).length < PAGE_SIZE;
				loadMoreButton.hidden = loadedAll;
				status.textContent = loadedAll ? `Showing ${products.children.length} products.` : `Showing ${products.children.length} products.`;
			} catch (error) {
				status.classList.add('error');
				status.textContent = error.message || 'Unable to load a product right now.';
				loadMoreButton.hidden = true;
			} finally {
				loadMoreButton.disabled = false;
			}
		}

		loadMoreButton.addEventListener('click', loadProducts);
		searchForm.addEventListener('submit', (event) => {
			event.preventDefault();
			searchTerm = searchInput.value.trim();
			offset = 0;
			totalRows = 0;
			products.replaceChildren();
			loadMoreButton.hidden = false;
			loadProducts();
		});
		function closeModal() {
			imageModal.hidden = true;
			modalImage.removeAttribute('src');
			document.body.style.overflow = '';
		}

		closeModalButton.addEventListener('click', closeModal);
		imageModal.addEventListener('click', (event) => {
			if (event.target === imageModal) closeModal();
		});
		document.addEventListener('keydown', (event) => {
			if (event.key === 'Escape' && !imageModal.hidden) closeModal();
		});

		loadProducts();
	</script>
</body>
</html>
