<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#fffdf8">
	<title>Product</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #17221d;
			--muted: #65736b;
			--paper: #f5f1e8;
			--panel: #fffdf8;
			--accent: #d85d36;
			--accent-dark: #a93d20;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			color: var(--ink);
			background: linear-gradient(135deg, var(--paper), #e4eee5);
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			width: 100%;
			min-height: 100vh;
			padding: clamp(12px, 3vw, 32px);
			background: var(--panel);
		}

		h1 {
			margin: 0 0 16px;
			text-align: center;
			font-size: clamp(24px, 5vw, 38px);
		}

		#product-image {
			display: block;
			width: 100%;
			max-height: 82vh;
			object-fit: contain;
			background: #f3f0e9;
			border-radius: 10px;
		}

		#image-trigger {
			display: block;
			width: 100%;
			padding: 0;
			background: transparent;
		}

		#image-trigger:hover { background: transparent; transform: none; }
		#product-image { cursor: zoom-in; }

		.product-details {
			margin: 0 0 14px;
			color: var(--accent-dark);
			font: 700 18px/1.4 Arial, sans-serif;
			white-space: pre-wrap;
		}

		#image-modal {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: grid;
			place-items: center;
			padding: 24px;
			background: rgba(12, 17, 14, .94);
		}

		#image-modal[hidden] { display: none; }

		#modal-image {
			max-width: 96vw;
			max-height: 90vh;
			object-fit: contain;
			box-shadow: 0 18px 45px rgba(0, 0, 0, .38);
		}

		#close-modal {
			position: fixed;
			top: 18px;
			right: 18px;
			min-width: 0;
			padding: 10px 16px;
			font-size: 24px;
			line-height: 1;
		}

		.actions {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
			margin-top: 0;
		}

		button {
			min-width: 0;
			padding: 16px 20px;
			border: 0;
			color: #fff;
			background: var(--accent);
			font: 700 16px/1 Arial, sans-serif;
			cursor: pointer;
			transition: background .2s ease, transform .2s ease;
		}

		button:hover { background: var(--accent-dark); transform: translateY(-1px); }
		button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

		#status {
			margin: 24px 0;
			color: var(--muted);
			text-align: center;
			font: 15px/1.5 Arial, sans-serif;
		}

		@media (max-width: 520px) {
			main { padding: 10px; }
			#product-image { max-height: none; }
			.actions { grid-template-columns: 1fr; gap: 8px; }
		}
	</style>
	<script src="app-launch.js" defer></script>
</head>
<body>
	<main>
		<h1>Product</h1>
		<p id="status" role="status" hidden></p>
		<button id="image-trigger" type="button" aria-label="Open full-size product image" hidden>
			<img id="product-image" alt="Product" hidden>
		</button>
		<p id="product-details" class="product-details" hidden></p>
		<div class="actions" id="actions" hidden>
			<button id="order-button" type="button">Order now or More details</button>
			<button id="share-button" type="button">Share</button>
		</div>
	</main>
	<div id="image-modal" role="dialog" aria-modal="true" aria-label="Full-size product image" hidden>
		<button id="close-modal" type="button" aria-label="Close full-size image">&times;</button>
		<img id="modal-image" alt="Full-size product">
	</div>

	<script>
		const params = new URLSearchParams(window.location.search);
		const imageUrl = (params.get('img') || '').trim();
		const orderUrl = (params.get('ama') || '').trim();
		const productDetails = (params.get('details') || '').trim();
		const image = document.querySelector('#product-image');
		const imageTrigger = document.querySelector('#image-trigger');
		const details = document.querySelector('#product-details');
		const actions = document.querySelector('#actions');
		const status = document.querySelector('#status');
		const orderButton = document.querySelector('#order-button');
		const shareButton = document.querySelector('#share-button');
		const imageModal = document.querySelector('#image-modal');
		const modalImage = document.querySelector('#modal-image');
		const closeModalButton = document.querySelector('#close-modal');
		if (productDetails) {
			details.textContent = productDetails;
			details.hidden = false;
		}

		function validHttpUrl(value) {
			try {
				const url = new URL(value);
				return url.protocol === 'https:' || url.protocol === 'http:';
			} catch {
				return false;
			}
		}

		if (validHttpUrl(imageUrl)) {
			image.src = imageUrl;
			image.hidden = false;
			imageTrigger.hidden = false;
			image.addEventListener('error', () => {
				imageTrigger.hidden = true;
				status.textContent = 'The image URL in column A could not be loaded. Check that it points directly to an image file and is publicly accessible.';
				status.hidden = false;
			}, { once: true });
		} else {
			status.textContent = 'This product link is missing a valid image URL.';
			status.hidden = false;
		}

		if (validHttpUrl(orderUrl)) {
			orderButton.addEventListener('click', () => {
				window.open(orderUrl, '_blank', 'noopener,noreferrer');
			});
			actions.hidden = false;
		} else {
			orderButton.hidden = true;
			if (validHttpUrl(imageUrl)) actions.hidden = false;
		}

		imageTrigger.addEventListener('click', () => {
			modalImage.src = imageUrl;
			imageModal.hidden = false;
			document.body.style.overflow = 'hidden';
			closeModalButton.focus();
		});

		function closeModal() {
			imageModal.hidden = true;
			modalImage.removeAttribute('src');
			document.body.style.overflow = '';
			imageTrigger.focus();
		}

		closeModalButton.addEventListener('click', closeModal);
		imageModal.addEventListener('click', (event) => {
			if (event.target === imageModal) closeModal();
		});
		document.addEventListener('keydown', (event) => {
			if (event.key === 'Escape' && !imageModal.hidden) closeModal();
		});

		shareButton.addEventListener('click', async () => {
			const shareUrl = new URL(window.location.href);
			shareUrl.search = '';
			shareUrl.searchParams.set('img', imageUrl);
			if (validHttpUrl(orderUrl)) shareUrl.searchParams.set('ama', orderUrl);
			if (productDetails) shareUrl.searchParams.set('details', productDetails);

			const shareText = [
				'YAN1 APP GEN 1',
				'Found something interesting — have a look! ✨',
				productDetails ? `🛒 ${productDetails}` : '',
				'THANKS 🙏'
			].filter(Boolean).join('\n');

			try {
				if (navigator.share) {
					await navigator.share({
						title: 'YAN1 APP GEN 1',
						text: shareText,
						url: shareUrl.toString()
					});
				} else if (navigator.clipboard?.writeText) {
					await navigator.clipboard.writeText(`${shareText}\n${shareUrl.toString()}`);
					shareButton.textContent = 'Message copied';
					window.setTimeout(() => { shareButton.textContent = 'Share'; }, 2000);
				} else {
					window.prompt('Copy this message to share:', `${shareText}\n${shareUrl.toString()}`);
				}
			} catch (error) {
				if (error.name !== 'AbortError') {
					window.prompt('Copy this message to share:', `${shareText}\n${shareUrl.toString()}`);
				}
			}
		});
	</script>
</body>
</html>
