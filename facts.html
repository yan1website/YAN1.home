<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YAN1 Fun Facts</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#111;
    color:white;
    text-align:center;
}


header{
    background:#e50914;
    padding:20px;
    font-size:30px;
    font-weight:bold;
}


.container{

    max-width:900px;
    margin:40px auto;
    padding:20px;

}


#facts{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;

}



.card{

    background:#222;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px #000;
    min-height:180px;
    display:flex;
    align-items:center;
    justify-content:center;

}



.fact{

    font-size:20px;
    line-height:1.5;

}



.number{

    color:#e50914;
    font-size:22px;
    font-weight:bold;

}



button{

    margin-top:30px;
    padding:15px 35px;
    border:none;
    background:#e50914;
    color:white;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;

}


button:hover{

    background:#ff3344;

}



.loading{

    font-size:22px;
    color:#aaa;

}



footer{

    margin-top:50px;
    padding:20px;
    color:#888;

}


</style>

</head>


<body>


<header>
    YAN1 Fun Facts
</header>



<div class="container">


<div id="facts">

    <div class="loading">
        Loading facts...
    </div>

</div>



<button onclick="getFacts()">

    Get New Facts

</button>


</div>



<footer>

    Powered by YAN1 Fun Facts

</footer>




<script>

async function getFacts() {
    const factsBox = document.getElementById("facts");

    factsBox.innerHTML = `
        <div class="loading">
            Loading facts...
        </div>
    `;

    try {
        const facts = [];

        for (let i = 0; i < 3; i++) {
            const response = await fetch("https://uselessfacts.jsph.pl/api/v2/facts/random?language=en");
            if (!response.ok) {
                throw new Error("API request failed");
            }

            const data = await response.json();
            if (data && data.text) {
                facts.push(data.text);
            }
        }

        factsBox.innerHTML = "";

        facts.forEach((fact, index) => {
            factsBox.innerHTML += `
            <div class="card">
                <div class="fact">
                    <div class="number">
                        Fact ${index + 1}
                    </div>
                    <br>
                    ${fact}
                </div>
            </div>
            `;
        });
    }
    catch (error) {
        factsBox.innerHTML = `
        <div class="loading">
            Failed to load facts.
        </div>
        `;
        console.log(error);
    }
}

getFacts();

</script>


</body>
</html>
