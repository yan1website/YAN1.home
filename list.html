<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Website List</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 28px 18px; color: #f8fafc; background: #111827; font-family: system-ui, sans-serif; }
    main { width: min(100%, 900px); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .heading-actions { display: flex; align-items: center; gap: 10px; min-width: 0; }
    h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2rem); }
    .home-link, #reload-list { display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid #6b7280; border-radius: 9px; color: #f9fafb; background: #374151; }
    .home-link { font-size: 24px; line-height: 1; text-decoration: none; }
    #reload-list { padding: 9px; cursor: pointer; }
    #reload-list svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #reload-list:disabled { cursor: wait; opacity: .65; }
    .home-link:hover, .home-link:focus-visible, #reload-list:hover:not(:disabled), #reload-list:focus-visible, .site-link:hover, .site-link:focus-visible { background: #4b5563; outline: 2px solid #93c5fd; outline-offset: 2px; }
    #search-form { display: flex; gap: 8px; margin-bottom: 16px; }
    #search-input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid #6b7280; border-radius: 8px; color: #f8fafc; background: #1f2937; font: inherit; }
    #search-input:focus-visible, #search-form button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
    #search-form button { padding: 10px 16px; border: 1px solid #6b7280; border-radius: 8px; color: #f9fafb; background: #374151; font: inherit; cursor: pointer; }
    #search-form button:hover { background: #4b5563; }
    #result-count { min-height: 1.5em; color: #d1d5db; font-size: 14px; }
    #sites { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; margin: 0; padding: 0; list-style: none; }
    .site-link { display: block; height: 100%; overflow: hidden; border: 1px solid #374151; border-radius: 9px; color: #bfdbfe; background: #1f2937; text-decoration: none; }
    .site-image { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #374151; }
    .site-info { display: block; padding: 12px 14px; overflow-wrap: anywhere; }
    .site-name { display: block; font-weight: 650; }
    .site-description { display: block; margin-top: 5px; color: #d1d5db; font-size: 14px; font-weight: 400; }
    #message { color: #fca5a5; }
  </style>
  <script src="app-launch.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="heading-actions">
        <h1>Website List</h1>
        <button id="reload-list" type="button" aria-label="Reload website list" title="Reload website list">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg>
        </button>
      </div>
      <a class="home-link" href="index.html" aria-label="Back to home" title="Back to home">⌂</a>
    </header>
    <form id="search-form" role="search">
      <input id="search-input" type="search" placeholder="Search websites..." aria-label="Search websites">
      <button type="submit">Search</button>
    </form>
    <p id="result-count" aria-live="polite"></p>
    <ul id="sites" aria-label="Websites"></ul>
    <p id="message" role="status"></p>
  </main>
  <script>
    const sites = document.querySelector('#sites');
    const message = document.querySelector('#message');
    const searchForm = document.querySelector('#search-form');
    const searchInput = document.querySelector('#search-input');
    const resultCount = document.querySelector('#result-count');
    const reloadButton = document.querySelector('#reload-list');
    let siteEntries = [];

    function isValidPagePath(path) {
      return typeof path === 'string'
        && path.endsWith('.html')
        && !path.includes('\\')
        && path.split('/').every(segment => segment && segment !== '.' && segment !== '..');
    }

    function editDistance(left, right) {
      let previous = Array.from({ length: right.length + 1 }, (_, index) => index);
      for (let row = 1; row <= left.length; row++) {
        const current = [row];
        for (let column = 1; column <= right.length; column++) {
          current[column] = Math.min(
            current[column - 1] + 1,
            previous[column] + 1,
            previous[column - 1] + (left[row - 1] === right[column - 1] ? 0 : 1)
          );
        }
        previous = current;
      }
      return previous[right.length];
    }

    function searchScore(site, query) {
      const terms = query.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);
      if (!terms.length) return 1;
      const searchableText = `${site.name} ${site.description}`.toLocaleLowerCase();
      const words = searchableText.split(/[^a-z0-9]+/).filter(Boolean);
      let score = 0;

      for (const term of terms) {
        if (searchableText.includes(term)) {
          score += 2;
        } else if (term.length >= 4 && words.some(word => editDistance(term, word) <= 1)) {
          score += 1;
        }
      }
      return score;
    }

    function renderSites(query = '') {
      const matches = siteEntries
        .map(site => ({ site, score: searchScore(site, query) }))
        .filter(result => result.score > 0)
        .sort((left, right) => right.score - left.score);
      sites.replaceChildren();

      for (const { site } of matches) {
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.className = 'site-link';
        link.href = `index.html?${encodeURIComponent(site.name)}`;

        const image = document.createElement('img');
        image.className = 'site-image';
        image.src = site.imageUrl;
        image.alt = `${site.name} preview`;
        image.loading = 'lazy';

        const info = document.createElement('span');
        info.className = 'site-info';
        const name = document.createElement('span');
        name.className = 'site-name';
        name.textContent = site.name;
        const description = document.createElement('span');
        description.className = 'site-description';
        description.textContent = site.description;
        info.append(name, description);
        link.append(image, info);
        item.append(link);
        sites.append(item);
      }

      resultCount.textContent = matches.length
        ? `${matches.length} ${matches.length === 1 ? 'result' : 'results'}`
        : 'No matching websites found.';
    }

    searchForm.addEventListener('submit', event => {
      event.preventDefault();
      renderSites(searchInput.value);
    });
    searchInput.addEventListener('input', () => renderSites(searchInput.value));
    reloadButton.addEventListener('click', loadSites);

    async function loadSites() {
      reloadButton.disabled = true;
      message.textContent = '';
      try {
        const response = await fetch('list1.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Could not read list1.json (${response.status})`);
        const files = await response.json();
        if (!Array.isArray(files) || files.some(site =>
          !site || typeof site !== 'object' || !isValidPagePath(site.name)
          || typeof site.description !== 'string' || !site.description.trim()
          || typeof site.imageUrl !== 'string'
          || !['https:', 'http:'].includes(new URL(site.imageUrl).protocol)
        )) {
          throw new Error('list1.json must contain website names, descriptions, and image URLs.');
        }

        const seenNames = new Set();
        siteEntries = files.filter(site => {
          if (seenNames.has(site.name)) return false;
          seenNames.add(site.name);
          return true;
        });
        renderSites(searchInput.value);
      } catch (error) {
        message.textContent = `${error.message} Open this site through a local web server so the browser can fetch the JSON file.`;
      } finally {
        reloadButton.disabled = false;
      }
    }

    loadSites();
  </script>
</body>
</html>
