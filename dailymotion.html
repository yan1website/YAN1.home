<!DOCTYPE html>
<html>

<head>

<title>Random Dailymotion Infinite Viewer</title>

<meta name="viewport" content="width=device-width,initial-scale=1">


<style>

body{
    font-family:Arial;
    margin:0;
    padding:20px;
    background:#f5f5f5;
}



.searchBox{

    position:sticky;
    top:0;
    background:white;
    padding:15px;
    z-index:10;

}



input{

    width:70%;
    padding:12px;
    font-size:18px;

}



button{

    padding:12px 18px;
    font-size:18px;
    cursor:pointer;

}



.video{

    background:white;
    margin:20px 0;
    padding:15px;
    border-radius:10px;

}



iframe{

    width:100%;
    aspect-ratio:16 / 9;
    height:auto;
    border:0;

}


.videoThumbnail{
    position:relative;
    width:100%;
    aspect-ratio:16 / 9;
    cursor:pointer;
    overflow:hidden;
    border-radius:8px;
}

.videoThumbnail img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.playButton{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:70px;
    height:70px;
    border-radius:50%;
    background:rgba(0,0,0,0.75);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
}

.videoThumbnail:hover .playButton{
    background:rgba(0,0,0,0.9);
}



h3{

    font-size:18px;

}



#loading{

    text-align:center;
    padding:20px;
    font-size:18px;

}


</style>


</head>


<body>


<div class="searchBox">

<input id="searchInput" placeholder="Search Dailymotion">


<button onclick="userSearch()">
Search
</button>


</div>



<div id="videos"></div>


<div id="loading"></div>




<script>


const SHEET_ID =
"1qkFOAcrXXBjbAJoHLorSyTXMpPrRfBoX5DDGGstiP8M";



let keyword = "";

let page = 1;

let loading = false;

let finished = false;






// Read Google Sheet

async function getSheetData(query){


    const url =
    "https://docs.google.com/spreadsheets/d/" +
    SHEET_ID +
    "/gviz/tq?tq=" +
    encodeURIComponent(query);



    const response =
    await fetch(url);



    const text =
    await response.text();




    const json = JSON.parse(

        text.substring(
            text.indexOf("{"),
            text.lastIndexOf("}") + 1
        )

    );



    return json.table;

}






// Existing sheet workflow
// Get random Column B value

async function getRandomSheetKeyword(){


    const countData =
    await getSheetData(

        "select count(B) where B is not null"

    );



    const totalRows =
    countData.rows[0].c[0].v;




    if(totalRows==0){

        return "";

    }




    const randomRow =
    Math.floor(Math.random()*totalRows);





    const rowData =
    await getSheetData(

        "select B where B is not null limit 1 offset "
        + randomRow

    );




    if(rowData.rows.length==0){

        return "";

    }



    return rowData.rows[0].c[0].v;


}








// Dailymotion search

function playDailymotion(element, videoId){

    const iframe = document.createElement("iframe");

    iframe.loading = "lazy";

    iframe.src =
        "https://www.dailymotion.com/embed/video/" +
        videoId;

    iframe.allowFullscreen = true;

    iframe.setAttribute(
        "allow",
        "autoplay; fullscreen; picture-in-picture"
    );

    element.replaceWith(iframe);
}


async function loadDailymotion(){



    if(loading || finished){

        return;

    }



    loading=true;



    document.getElementById("loading").innerHTML =
    "Loading...";





    try{


        const url =

        "https://api.dailymotion.com/videos?search=" +

        encodeURIComponent(keyword) +

        "&fields=id,title,thumbnail_url" +

        "&limit=20" +

        "&page=" + page;





        const response =
        await fetch(url);



        const data =
        await response.json();





        if(data.list.length==0){


            finished=true;


            document.getElementById("loading").innerHTML =
            "No more results";


            return;

        }






        let html="";





        data.list.forEach(video=>{


            html += `

            <div class="video">


                <h3>${video.title}</h3>

                <div
                    class="videoThumbnail"
                    onclick="playDailymotion(this, '${video.id}')"
                >
                    <img
                        src="${video.thumbnail_url}"
                        alt="${video.title}"
                        loading="lazy"
                    >

                    <div class="playButton">
                        ▶
                    </div>
                </div>


            </div>


            `;



        });






        document.getElementById("videos").insertAdjacentHTML(

            "beforeend",

            html

        );





        page++;




        document.getElementById("loading").innerHTML="";



    }


    catch(error){


        console.log(error);


        document.getElementById("loading").innerHTML =
        "Error loading";


    }



    loading=false;


}








// User search

function userSearch(){


    const value =
    document.getElementById("searchInput").value.trim();



    if(value==""){

        return;

    }



    keyword=value;



    page=1;

    finished=false;



    document.getElementById("videos").innerHTML="";



    loadDailymotion();


}








// Infinite scrolling

window.addEventListener("scroll",function(){



    if(

        window.innerHeight +

        window.scrollY >=

        document.body.offsetHeight - 500

    ){


        loadDailymotion();


    }


});









// Start with Google Sheet random Column B

window.onload = async function(){


    keyword =
    await getRandomSheetKeyword();



    if(keyword!=""){


        document.getElementById("searchInput").value =
        keyword;



        loadDailymotion();


    }


};



</script>


</body>

</html>
