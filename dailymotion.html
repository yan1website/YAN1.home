<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Dailymotion Infinite Viewer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .searchBox {
            position: sticky;
            top: 0;
            background: white;
            padding: 15px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        input {
            width: 70%;
            padding: 12px;
            font-size: 18px;
        }

        button {
            padding: 12px 18px;
            font-size: 18px;
            cursor: pointer;
        }

        .video {
            background: white;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
        }

        h3 {
            font-size: 18px;
            margin-top: 0;
        }

        /* Dailymotion player */

        .videoPlayer {
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            border: 0;
            border-radius: 8px;
            display: block;
            background: #000;
        }

        .videoActions {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .shareLink,
        .fullscreenButton {
            border: 0;
            border-radius: 6px;
            color: white;
            padding: 8px 12px;
            font-size: 22px;
            cursor: pointer;
            line-height: 1.2;
        }

        .shareLink {
            background: #2563eb;
        }

        .fullscreenButton {
            background: #374151;
        }

        .videoPlayer:fullscreen {
            width: 100vw;
            height: 100vh;
            aspect-ratio: auto;
            border-radius: 0;
        }

        #loading {
            text-align: center;
            padding: 20px;
            font-size: 18px;
        }
    </style>

    <script src="app-launch.js" defer></script>

</head>


<body>


<div class="searchBox">

    <input
        id="searchInput"
        placeholder="Search Dailymotion"
    >

    <button onclick="userSearch()">
        Search
    </button>

</div>


<div id="videos"></div>

<div id="loading"></div>


<script>

const SHEET_ID =
"1qkFOAcrXXBjbAJoHLorSyTXMpPrRfBoX5DDGGstiP8M";


let keyword = "";
let page = 1;
let loading = false;
let finished = false;


/* =========================================================
   GOOGLE SHEET
========================================================= */

async function getSheetData(query) {

    const url =
        "https://docs.google.com/spreadsheets/d/" +
        SHEET_ID +
        "/gviz/tq?tq=" +
        encodeURIComponent(query);

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error("Google Sheet request failed");
    }

    const text = await response.text();

    const json = JSON.parse(
        text.substring(
            text.indexOf("{"),
            text.lastIndexOf("}") + 1
        )
    );

    return json.table;
}


/* =========================================================
   RANDOM COLUMN B KEYWORD
========================================================= */

async function getRandomSheetKeyword() {

    const countData = await getSheetData(
        "select count(B) where B is not null"
    );

    if (
        !countData.rows ||
        !countData.rows[0] ||
        !countData.rows[0].c[0]
    ) {
        return "";
    }

    const totalRows =
        Number(countData.rows[0].c[0].v);

    if (totalRows <= 0) {
        return "";
    }

    const randomRow =
        Math.floor(Math.random() * totalRows);

    const rowData = await getSheetData(
        "select B where B is not null limit 1 offset " +
        randomRow
    );

    if (
        !rowData.rows ||
        rowData.rows.length === 0 ||
        !rowData.rows[0].c[0]
    ) {
        return "";
    }

    return rowData.rows[0].c[0].v;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   SHARE VIDEO
========================================================= */

async function shareVideo(videoId, title) {

    const url = new URL(
        "https://yan1website.github.io/YAN1.home/dailymotion2.html"
    );

    url.searchParams.set("txt", videoId);


    const videoTitle = title || "Dailymotion video";
    const text = `YAN1 APP GEN 1\nYAN1 APP GEN 1\nFound something interesting — have a look! ✨\n🎬 ${videoTitle}\nTHANKS 🙏`;
    const shareData = {
        title: videoTitle,
        text,
        url: url.href
    };


    try {

        if (navigator.share) {

            await navigator.share(shareData);

        }

        else if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                `${text}\n${url.href}`
            );

            alert(
                "Permanent link copied. You can paste it into any app."
            );

        }

        else {

            window.prompt(
                "Copy this share message and link:",
                `${text}\n${url.href}`
            );
        }

    }

    catch (error) {

        if (error.name !== "AbortError") {

            window.prompt(
                "Copy this share message and link:",
                `${text}\n${url.href}`
            );
        }
    }
}


/* =========================================================
   LOAD DAILYMOTION RESULTS
========================================================= */

async function loadDailymotion() {

    if (loading || finished) {
        return;
    }

    if (!keyword) {
        return;
    }

    loading = true;


    document.getElementById("loading").innerHTML =
        "Loading...";


    try {

        const url =
            "https://api.dailymotion.com/videos?search=" +
            encodeURIComponent(keyword) +
            "&fields=id,title" +
            "&limit=20" +
            "&page=" +
            page;


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Dailymotion API error: " +
                response.status
            );
        }


        const data =
            await response.json();


        if (
            !data.list ||
            data.list.length === 0
        ) {

            finished = true;

            document.getElementById("loading").innerHTML =
                "No more results";

            loading = false;

            return;
        }


        let html = "";


        data.list.forEach(video => {

            if (!video.id) {
                return;
            }


            const title =
                escapeHTML(
                    video.title ||
                    "Dailymotion Video"
                );


            const videoId =
                escapeHTML(video.id);


            html += `

                <div class="video">

                    <h3>
                        ${title}
                    </h3>


                    <iframe
                        class="videoPlayer"
                        src="https://geo.dailymotion.com/player/x1k7p.html?video=${videoId}&amp;controls=1&amp;autoplay=1&amp;mute=1"
                        title="${title}"
                        allow="autoplay; fullscreen; picture-in-picture; web-share"
                        allowfullscreen
                        referrerpolicy="strict-origin-when-cross-origin"
                        loading="lazy"
                    ></iframe>


                    <div class="videoActions">

                        <button
                            class="shareLink"
                            type="button"
                            aria-label="Share video"
                            data-video-id="${videoId}"
                            data-video-title="${title}"
                        >
                            ᯓ➤
                        </button>

                        <button
                            class="fullscreenButton"
                            type="button"
                            aria-label="Play video in fullscreen"
                            title="Play video in fullscreen"
                            data-video-id="${videoId}"
                        >
                            ⛶
                        </button>

                    </div>

                </div>

            `;
        });


        document
            .getElementById("videos")
            .insertAdjacentHTML(
                "beforeend",
                html
            );


        page++;


        document.getElementById("loading").innerHTML = "";

    }

    catch (error) {

        console.error(error);

        document.getElementById("loading").innerHTML =
            "Error loading videos";

    }


    loading = false;
}


/* =========================================================
   FULLSCREEN BUTTON HANDLER
========================================================= */

document
    .getElementById("videos")
    .addEventListener(
        "click",
        function(event) {

            const button =
                event.target.closest(
                    ".fullscreenButton"
                );


            if (!button) {
                return;
            }


            event.preventDefault();

            event.stopPropagation();


            const card = button.closest(".video");


            const player =
                card.querySelector(".videoPlayer");


            if (player && player.requestFullscreen) {
                player.requestFullscreen().catch(error => {
                    console.error("Unable to enter fullscreen:", error);
                });
            }
        }
    );


/* =========================================================
   SHARE BUTTON HANDLER
========================================================= */

document
    .getElementById("videos")
    .addEventListener(
        "click",
        function(event) {

            const button =
                event.target.closest(
                    ".shareLink"
                );


            if (!button) {
                return;
            }


            event.preventDefault();

            event.stopPropagation();


            shareVideo(
                button.dataset.videoId,
                button.dataset.videoTitle
            );
        }
    );


/* =========================================================
   USER SEARCH
========================================================= */

function userSearch() {

    const value =
        document
            .getElementById("searchInput")
            .value
            .trim();


    if (!value) {
        return;
    }


    keyword = value;

    page = 1;

    finished = false;


    document
        .getElementById("videos")
        .innerHTML = "";


    loadDailymotion();
}


/* =========================================================
   INFINITE SCROLL
========================================================= */

window.addEventListener(
    "scroll",
    function() {

        if (
            window.innerHeight +
            window.scrollY >=
            document.body.offsetHeight - 500
        ) {

            loadDailymotion();
        }
    }
);


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    async function() {

        try {

            keyword =
                await getRandomSheetKeyword();


            if (keyword) {

                document
                    .getElementById("searchInput")
                    .value = keyword;


                loadDailymotion();
            }

        }

        catch (error) {

            console.error(error);

            document.getElementById("loading").innerHTML =
                "Unable to load search keyword.";
        }

    }
);

</script>

</body>
</html>
