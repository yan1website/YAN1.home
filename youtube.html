<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    main { width: min(100%, 1120px); text-align: center; }
    #status { margin: 20px 0; color: #aaa; }
    .video-container {
      display: none;
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      border-radius: 12px;
    }
    .video-actions { display: flex; justify-content: center; margin-top: 12px; }
    .share-button { padding: 7px 10px; border: 0; border-radius: 7px; color: #fff; background: #2563eb; cursor: pointer; font-size: 14px; line-height: 1; }
    .thumbnail-button,
    .thumbnail-button img,
    iframe { width: 100%; height: 100%; border: 0; }
    .thumbnail-button {
      position: absolute;
      inset: 0;
      padding: 0;
      cursor: pointer;
      background: #000;
    }
    .thumbnail-button img { display: block; object-fit: cover; }
    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72px;
      height: 52px;
      border-radius: 14px;
      background: #f00;
    }
    .play-icon::after {
      content: '';
      position: absolute;
      top: 14px;
      left: 29px;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 18px solid #fff;
    }
    iframe { display: none; }
  </style>
  <script src="app-launch.js" defer></script>
</head>
<body>
  <main>
    <p id="status">Loading video...</p>
    <div id="videoContainer" class="video-container">
      <button id="thumbnailButton" class="thumbnail-button" type="button" aria-label="Play video">
        <img id="videoThumbnail" alt="Video thumbnail">
        <span class="play-icon" aria-hidden="true"></span>
      </button>
      <iframe
        id="youtubePlayer"
        title="YouTube video"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
    <div id="videoActions" class="video-actions" hidden>
      <button id="shareButton" class="share-button" type="button" aria-label="Share this video">➤</button>
    </div>
  </main>

  <script>
    const SPREADSHEET_ID = '1qkFOAcrXXBjbAJoHLorSyTXMpPrRfBoX5DDGGstiP8M';
    const SHEET_NAME = 'Sheet1';

    function sheetQueryUrl(query) {
      const params = new URLSearchParams({
        sheet: SHEET_NAME,
        tqx: 'out:json',
        tq: query
      });
      return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params}`;
    }

    async function querySheet(query) {
      const response = await fetch(sheetQueryUrl(query), { cache: 'no-store' });
      if (!response.ok) throw new Error(`Google Sheets request failed (${response.status})`);

      const text = await response.text();
      const start = text.indexOf('{');
      const end = text.lastIndexOf('}');
      if (start < 0 || end < start) throw new Error('Invalid Google Sheets response');

      const result = JSON.parse(text.slice(start, end + 1));
      if (result.status !== 'ok') {
        throw new Error(result.errors?.[0]?.detailed_message || 'The sheet query failed');
      }
      return result.table;
    }

    let selectedSheetValue = '';
    let videoTitlePromise = Promise.resolve('YouTube video');

    async function fetchVideoTitle(videoId) {
      const videoUrl = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;
      const response = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(videoUrl)}&format=json`);
      if (!response.ok) throw new Error('Unable to retrieve the YouTube title.');
      const data = await response.json();
      return data.title || 'YouTube video';
    }

    function setVideoThumbnail(videoId) {
      const thumbnail = document.querySelector('#videoThumbnail');
      thumbnail.onerror = () => {
        if (thumbnail.dataset.fallback) return;
        thumbnail.dataset.fallback = 'true';
        thumbnail.src = `https://img.youtube.com/vi/${encodeURIComponent(videoId)}/hqdefault.jpg`;
      };
      thumbnail.src = `https://img.youtube.com/vi/${encodeURIComponent(videoId)}/maxresdefault.jpg`;
    }

    async function getRandomVideoId() {
      const countTable = await querySheet('select count(I) where I is not null');
      const rowCount = Number(countTable.rows?.[0]?.c?.[0]?.v || 0);
      if (!Number.isInteger(rowCount) || rowCount < 1) {
        throw new Error('No YouTube IDs were found in column I.');
      }

      const randomOffset = Math.floor(Math.random() * rowCount);
      const selectedTable = await querySheet(
        `select I where I is not null limit 1 offset ${randomOffset}`
      );
      const cellValue = String(selectedTable.rows?.[0]?.c?.[0]?.v || '').trim();
      selectedSheetValue = cellValue;
      const videoId = cellValue.split('?')[0].split('&')[0];
      if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
        throw new Error('The selected cell does not contain a valid YouTube ID.');
      }
      return videoId;
    }

    async function shareVideo() {
      if (!selectedSheetValue) return;
      const url = new URL('https://yan1website.github.io/YAN1.home/index.html?youtube1.html');
      url.searchParams.set('txt', selectedSheetValue);
      const videoTitle = await videoTitlePromise;
      const shareTitle = 'YAN1 APP GEN 1';
      const shareText = [
        'YAN1 APP GEN 1',
        'YAN1 APP GEN 1',
        'Found something interesting — have a look! ✨',
        `🎬 ${videoTitle}`,
        'THANKS 🙏'
      ].join('\n');
      const message = `${shareText}\n${url.href}`;
      try {
        if (navigator.share) {
          await navigator.share({ title: shareTitle, text: shareText, url: url.href });
        } else if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(message);
          alert('YouTube share message copied. You can paste it into any app.');
        } else {
          window.prompt('Copy this YouTube share message:', message);
        }
      } catch (error) {
        if (error.name !== 'AbortError') window.prompt('Copy this YouTube share message:', message);
      }
    }

    async function loadRandomVideo() {
      const status = document.querySelector('#status');
      try {
        const videoId = await getRandomVideoId();
          const player = document.querySelector('#youtubePlayer');
          const thumbnailButton = document.querySelector('#thumbnailButton');
          const embedUrl =
            `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?origin=${encodeURIComponent(window.location.origin)}`;
          setVideoThumbnail(videoId);
          videoTitlePromise = fetchVideoTitle(videoId).catch(() => 'YouTube video');
          thumbnailButton.addEventListener('click', () => {
            player.src = embedUrl;
            player.style.display = 'block';
            thumbnailButton.style.display = 'none';
          }, { once: true });
        document.querySelector('#videoContainer').style.display = 'block';
        document.querySelector('#videoActions').hidden = false;
        status.style.display = 'none';
      } catch (error) {
        console.error(error);
        status.textContent = error.message || 'Unable to load a video.';
      }
    }

    document.querySelector('#shareButton').addEventListener('click', shareVideo);

    loadRandomVideo();
  </script>
</body>
</html>
