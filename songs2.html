<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#111827">
	<title>YAN1 Songs</title>
	<script src="app-launch.js" defer></script>
	<style>
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; padding: 28px 16px 44px; background: #111827; color: #f8fafc; font: 16px/1.5 system-ui, sans-serif; }
		main { width: min(100%, 900px); margin: 0 auto; }
		h1 { margin: 0 0 20px; text-align: center; font-size: clamp(24px, 5vw, 34px); }
		#search-form { display: flex; gap: 8px; margin: 0 0 18px; }
		#search-input { flex: 1; min-width: 0; min-height: 46px; padding: 10px 12px; border: 1px solid #4b5563; border-radius: 8px; background: #1f2937; color: #f8fafc; font: inherit; }
		#search-form button { min-height: 46px; padding: 10px 18px; border: 1px solid #93c5fd; border-radius: 8px; background: #93c5fd; color: #111827; font: inherit; font-weight: 700; cursor: pointer; }
		#search-form button:disabled { cursor: wait; opacity: .65; }
		#status { margin: 0 0 18px; padding: 12px; border-radius: 8px; background: #1f2937; color: #cbd5e1; text-align: center; }
		#status.error { color: #fca5a5; }
		#song-results { display: grid; gap: 20px; }
		.song-card { min-width: 0; padding: 16px; border: 1px solid #374151; border-radius: 12px; background: #1f2937; }
		.song-card-toolbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
		.share-button { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border: 1px solid #4b5563; border-radius: 50%; background: #111827; color: #f8fafc; cursor: pointer; }
		.share-button:hover { background: #374151; }
		.share-button svg { width: 20px; height: 20px; fill: currentColor; }
		.song-image { display: block; width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px; background: #030712; }
		.song-image[hidden], .song-player[hidden], .play-button[hidden], .next-button[hidden], .current-track[hidden] { display: none; }
		.song-title { margin: 16px 0; overflow-wrap: anywhere; text-align: center; font-size: clamp(18px, 4vw, 24px); }
		.play-button, .next-button { display: block; min-height: 48px; margin: 16px auto 0; padding: 10px 24px; border: 1px solid #93c5fd; border-radius: 8px; background: #93c5fd; color: #111827; font: inherit; font-weight: 700; cursor: pointer; }
		.play-button { margin-top: 0; }
		.play-button:hover, .next-button:hover { background: #bfdbfe; }
		.play-button:disabled, .next-button:disabled { cursor: wait; opacity: .65; }
		.song-player { display: block; width: 100%; height: 450px; margin-top: 16px; border: 0; border-radius: 8px; background: #030712; }
		.current-track { margin: 16px 0 0; color: #f8fafc; font-weight: 700; overflow-wrap: anywhere; text-align: center; }
		@media (max-width: 520px) {
			body { padding: 22px 10px 32px; }
			.song-card { padding: 12px; }
		}
	</style>
</head>
<body>
	<main>
		<h1>YAN1 Songs</h1>
		<form id="search-form" role="search">
			<input id="search-input" type="search" placeholder="Search songs" aria-label="Search song keywords" autocomplete="off">
			<button id="search-button" type="submit">Search</button>
		</form>
		<p id="status" role="status" aria-live="polite">Finding the shared playlist…</p>
		<section id="song-results" aria-label="Songs" hidden></section>
	</main>
	<script>
		const SPREADSHEET_ID = '16V460GzTVjgPBzhGAFtdG8wJGXiOE5VLPgZ5ofOHPwQ';
		const statusBox = document.querySelector('#status');
		const searchForm = document.querySelector('#search-form');
		const searchInput = document.querySelector('#search-input');
		const searchButton = document.querySelector('#search-button');
		const songResults = document.querySelector('#song-results');
		let allSongs;
		let widgetApiPromise;

		function cellValue(cell) {
			return String(cell?.v ?? cell?.f ?? '').trim();
		}

		async function runQuery(query) {
			const params = new URLSearchParams({ tqx: 'out:json', headers: '0', tq: query });
			const response = await fetch(`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params}`, { cache: 'no-store' });
			if (!response.ok) throw new Error(`Google Sheets request failed (${response.status}).`);
			const text = await response.text();
			const start = text.indexOf('{');
			const end = text.lastIndexOf('}');
			if (start < 0 || end < start) throw new Error('The Google Sheet returned an invalid response.');
			const data = JSON.parse(text.slice(start, end + 1));
			if (data.status !== 'ok') throw new Error(data.errors?.[0]?.detailed_message || 'The Google Sheet query failed.');
			return data.table;
		}

		function escapeQueryValue(value) {
			return value.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
		}

		function showError(message) {
			statusBox.textContent = message;
			statusBox.classList.add('error');
			statusBox.hidden = false;
		}

		function loadWidgetApi() {
			if (window.SC?.Widget) return Promise.resolve(window.SC);
			if (!widgetApiPromise) {
				widgetApiPromise = new Promise((resolve, reject) => {
					const script = document.createElement('script');
					script.src = 'https://w.soundcloud.com/player/api.js';
					script.onload = () => window.SC?.Widget ? resolve(window.SC) : reject(new Error('The SoundCloud player controls could not be loaded.'));
					script.onerror = () => reject(new Error('Unable to load the SoundCloud player controls.'));
					document.head.append(script);
				});
			}
			return widgetApiPromise;
		}

		async function shareSong(song) {
			const shareUrl = new URL('https://yan1website.github.io/YAN1.home/index.html?songs2.html');
			shareUrl.searchParams.set('txt', song.playlistUrl);
			const shareBody = [
				'YAN1 APP GEN 1',
				'YAN1 APP GEN 1',
				'Found something interesting — have a look! ✨',
				'🌐 free4chat , free , room',
				'THANKS 🙏'
			].join('\n');
			const shareText = `${shareBody}\n${shareUrl.href}`;
			try {
				if (navigator.share) {
					await navigator.share({ title: 'YAN1 APP GEN 1', text: shareBody, url: shareUrl.href });
				} else if (navigator.clipboard && window.isSecureContext) {
					await navigator.clipboard.writeText(shareText);
					alert('Share message copied.');
				} else {
					window.prompt('Copy this message to share:', shareText);
				}
			} catch (error) {
				if (error.name !== 'AbortError') window.prompt('Copy this message to share:', shareText);
			}
		}

		function createSongCard(song) {
			const card = document.createElement('article');
			card.className = 'song-card';

			const toolbar = document.createElement('div');
			toolbar.className = 'song-card-toolbar';
			const shareButton = document.createElement('button');
			shareButton.className = 'share-button';
			shareButton.type = 'button';
			shareButton.setAttribute('aria-label', `Share ${song.title}`);
			shareButton.title = 'Share';
			shareButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.3 3.3 0 0 0 0-1.39l7.05-4.11A3 3 0 1 0 15 5c0 .23.03.46.08.68L8.03 9.79a3 3 0 1 0 0 4.42l7.12 4.16a3 3 0 1 0 2.85-2.29Z"/></svg>';
			shareButton.addEventListener('click', () => shareSong(song));
			toolbar.append(shareButton);
			card.append(toolbar);

			if (/^https?:\/\//i.test(song.imageUrl)) {
				const image = document.createElement('img');
				image.className = 'song-image';
				image.src = song.imageUrl;
				image.alt = song.title || 'Song playlist';
				image.addEventListener('error', () => { image.hidden = true; }, { once: true });
				card.append(image);
			}

			const title = document.createElement('h2');
			title.className = 'song-title';
			title.textContent = song.title || 'Song playlist';
			card.append(title);

			const player = document.createElement('iframe');
			player.className = 'song-player';
			player.title = `SoundCloud playlist: ${song.title}`;
			player.allow = 'autoplay; encrypted-media';
			player.hidden = true;
			card.append(player);

			const currentTrack = document.createElement('p');
			currentTrack.className = 'current-track';
			currentTrack.setAttribute('aria-live', 'polite');
			currentTrack.hidden = true;
			card.append(currentTrack);

			const playButton = document.createElement('button');
			playButton.className = 'play-button';
			playButton.type = 'button';
			playButton.textContent = '▶ Play playlist';
			card.append(playButton);

			const nextButton = document.createElement('button');
			nextButton.className = 'next-button';
			nextButton.type = 'button';
			nextButton.textContent = '⏭ Next random song';
			nextButton.hidden = true;
			card.append(nextButton);

			playButton.addEventListener('click', async () => {
				playButton.disabled = true;
				statusBox.classList.remove('error');
				statusBox.textContent = 'Loading playlist…';
				statusBox.hidden = false;
				try {
					const oEmbedUrl = new URL('https://soundcloud.com/oembed');
					oEmbedUrl.search = new URLSearchParams({ format: 'json', url: song.playlistUrl });
					const response = await fetch(oEmbedUrl, { cache: 'no-store' });
					if (!response.ok) throw new Error(`SoundCloud playlist request failed (${response.status}).`);
					const embed = await response.json();
					const embedDocument = new DOMParser().parseFromString(embed.html || '', 'text/html');
					const embedSource = embedDocument.querySelector('iframe')?.getAttribute('src');
					if (!embedSource) throw new Error('SoundCloud did not provide a playlist player.');
					const playerUrl = new URL(embedSource);
					if (playerUrl.origin !== 'https://w.soundcloud.com') throw new Error('SoundCloud returned an unsupported playlist player URL.');
					playerUrl.searchParams.set('auto_play', 'true');
					playerUrl.searchParams.set('hide_related', 'true');
					playerUrl.searchParams.set('show_comments', 'false');
					playerUrl.searchParams.set('show_user', 'true');
					playerUrl.searchParams.set('show_reposts', 'false');

					const soundCloud = await loadWidgetApi();
					player.src = playerUrl.href;
					player.hidden = false;
					const widget = soundCloud.Widget(player);
					widget.bind(soundCloud.Widget.Events.READY, () => {
						widget.getSounds((sounds) => {
							if (!Array.isArray(sounds) || !sounds.length) {
								showError('This playlist has no playable tracks.');
								return;
							}
							let trackOrder = [];
							let trackPosition = 0;
							const shuffleTracks = () => {
								trackOrder = sounds.map((_, index) => index);
								for (let index = trackOrder.length - 1; index > 0; index -= 1) {
									const randomIndex = Math.floor(Math.random() * (index + 1));
									[trackOrder[index], trackOrder[randomIndex]] = [trackOrder[randomIndex], trackOrder[index]];
								}
								trackPosition = 0;
							};
							const updateCurrentTrack = (index) => {
								const showTrack = (sound) => {
									if (!sound?.title) return;
									currentTrack.textContent = `Current song: ${sound.title}`;
									currentTrack.hidden = false;
								};
								if (Number.isInteger(index)) showTrack(sounds[index]);
								else widget.getCurrentSound(showTrack);
							};
							shuffleTracks();
							widget.bind(soundCloud.Widget.Events.PLAY, updateCurrentTrack);
							nextButton.addEventListener('click', () => {
								nextButton.disabled = true;
								widget.getCurrentSoundIndex((currentIndex) => {
									const options = sounds.map((_, index) => index).filter((index) => index !== currentIndex);
									const nextIndex = options[Math.floor(Math.random() * options.length)] ?? currentIndex;
									trackOrder = [nextIndex, ...options.filter((index) => index !== nextIndex)];
									trackPosition = 0;
									widget.skip(nextIndex);
									updateCurrentTrack(nextIndex);
									widget.play();
									nextButton.disabled = false;
								});
							});
							widget.bind(soundCloud.Widget.Events.FINISH, () => {
								trackPosition += 1;
								if (trackPosition >= trackOrder.length) shuffleTracks();
								widget.skip(trackOrder[trackPosition]);
								updateCurrentTrack(trackOrder[trackPosition]);
								widget.play();
							});
							widget.skip(trackOrder[trackPosition]);
							updateCurrentTrack(trackOrder[trackPosition]);
							widget.play();
						});
					});
					const image = card.querySelector('.song-image');
					if (image) image.hidden = true;
					playButton.hidden = true;
					nextButton.hidden = false;
					statusBox.hidden = true;
				} catch (error) {
					showError(error.message || 'Unable to load the SoundCloud playlist.');
					playButton.disabled = false;
				}
			});
			return card;
		}

		function displaySongs(songs) {
			songResults.replaceChildren();
			songs.forEach((song) => songResults.append(createSongCard(song)));
			songResults.hidden = songs.length === 0;
			statusBox.hidden = songs.length > 0;
			if (!songs.length) showError('No matching songs were found.');
		}

		async function getAllSongs() {
			if (allSongs) return allSongs;
			const table = await runQuery('select A, B, C where A is not null');
			allSongs = (table.rows || []).map((row) => ({
				playlistUrl: cellValue(row.c?.[0]),
				title: cellValue(row.c?.[1]),
				imageUrl: cellValue(row.c?.[2])
			})).filter((song) => song.playlistUrl);
			return allSongs;
		}

		async function loadSharedSong() {
			const sharedUrl = new URLSearchParams(window.location.search).get('txt')?.trim();
			if (!sharedUrl) throw new Error('This link is missing its txt playlist URL.');
			const queryValue = escapeQueryValue(sharedUrl);
			const table = await runQuery(`select A, B, C where A = '${queryValue}' limit 1`);
			const row = table.rows?.[0];
			if (!row) throw new Error('No playlist matching this link was found in column A.');
			const song = {
				playlistUrl: cellValue(row.c?.[0]),
				title: cellValue(row.c?.[1]),
				imageUrl: cellValue(row.c?.[2])
			};
			displaySongs([song]);
		}

		searchForm.addEventListener('submit', async (event) => {
			event.preventDefault();
			const query = searchInput.value.trim().toLowerCase();
			if (!query) {
				showError('Enter text to search song keywords.');
				return;
			}
			searchButton.disabled = true;
			statusBox.textContent = 'Searching song keywords…';
			statusBox.classList.remove('error');
			statusBox.hidden = false;
			try {
				const songs = await getAllSongs();
				const matches = songs.filter((song) => song.title.toLowerCase().includes(query));
				displaySongs(matches);
			} catch (error) {
				showError(error.message || 'Unable to search songs in the Google Sheet.');
			} finally {
				searchButton.disabled = false;
			}
		});

		loadSharedSong().catch((error) => showError(error.message || 'Unable to load the shared playlist.'));
	</script>
</body>
</html>
