<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Wikipedia Article</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; padding: 20px; background: #f5f5f5; color: #222; font-family: Arial, Helvetica, sans-serif; }
		#searchForm { display: flex; gap: 8px; margin: 0 0 16px; }
		#searchInput { flex: 1; min-width: 0; min-height: 44px; padding: 10px 12px; border: 1px solid #aaa; border-radius: 6px; font: inherit; }
		#searchForm button { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 6px; color: #fff; background: #2563eb; font: inherit; cursor: pointer; }
		#searchForm button:hover { background: #1d4ed8; }
		#searchForm button:disabled { opacity: .65; cursor: wait; }
		.summary-actions { display: flex; justify-content: center; margin: 0 15px -5px; }
		.share-button { padding: 6px 10px; border: 0; border-radius: 7px; background: #2563eb; color: #fff; cursor: pointer; font-size: 14px; line-height: 1; }
		#summary { min-height: 70px; margin: 15px; padding: 20px; border-radius: 10px; background: #fff; line-height: 1.6; overflow-wrap: anywhere; }
		#summary h1 { margin-top: 0; }
		#summary a { color: #2563eb; }
		#status { margin: 10px 15px; color: #555; text-align: center; }
		#viewer { display: block; width: 100%; height: 80vh; border: 0; background: white; }
		.error { color: #b42318 !important; }
		@media (max-width: 600px) { body { padding: 10px; } #summary { margin: 12px 4px; padding: 16px; } #status { margin: 8px 4px; } }
	</style>
	<script src="app-launch.js" defer></script>
</head>
<body>
	<form id="searchForm" role="search">
		<input id="searchInput" type="search" placeholder="Search Wikipedia" aria-label="Search Wikipedia" autocomplete="off">
		<button id="searchButton" type="submit">Search</button>
	</form>
	<p id="status" role="status" aria-live="polite">Loading Wikipedia article…</p>
	<div class="summary-actions">
		<button id="shareButton" class="share-button" type="button" aria-label="Share this Wikipedia page">➤</button>
	</div>
	<section id="summary">Loading summary…</section>
	<iframe id="viewer" title="Wikipedia article"></iframe>
	<script>
		const status = document.querySelector('#status');
		const summary = document.querySelector('#summary');
		const viewer = document.querySelector('#viewer');
		const searchForm = document.querySelector('#searchForm');
		const searchInput = document.querySelector('#searchInput');
		const searchButton = document.querySelector('#searchButton');
		const rawText = (new URLSearchParams(window.location.search).get('txt') || '').trim();
		let currentTitle = '';
		let currentPageUrl = '';
		let loadVersion = 0;

		function decodeArticleInput(value) {
			let candidate = value;
			if (/^https?:\/\//i.test(candidate)) {
				const parsed = new URL(candidate);
				if (!/(^|\.)wikipedia\.org$/i.test(parsed.hostname)) throw new Error('The txt value must point to a Wikipedia article.');
				candidate = parsed.pathname.replace(/^\/wiki\//, '');
			} else {
				candidate = candidate.replace(/^([a-z-]+\.)?wikipedia\.org\/wiki\//i, '');
			}
			try { candidate = decodeURIComponent(candidate); } catch {}
			candidate = candidate.replace(/_/g, ' ').trim();
			if (!candidate || candidate.includes('/')) throw new Error('This link does not contain a valid Wikipedia article title.');
			return candidate;
		}

		async function shareWikipediaPage() {
			if (!currentPageUrl) return;
			const txtValue = currentPageUrl.replace(/^https:\/\//i, '');
			const shareUrl = new URL('https://yan1website.github.io/YAN1.home/index.html?wikipedia1.html');
			shareUrl.searchParams.set('txt', txtValue);
			const shareTitle = 'YAN1 APP GEN 1';
			const shareText = [
				'YAN1 APP GEN 1',
				'YAN1 APP GEN 1',
				'Found something interesting — have a look! ✨',
				`ⓘ ${currentTitle || 'Wikipedia page'}`,
				'THANKS 🙏'
			].join('\n');
			const message = `${shareText}\n${shareUrl.href}`;
			try {
				if (navigator.share) {
					await navigator.share({ title: shareTitle, text: shareText, url: shareUrl.href });
				} else if (navigator.clipboard && window.isSecureContext) {
					await navigator.clipboard.writeText(message);
					alert('Share link copied. You can paste it into any app.');
				} else {
					window.prompt('Copy this share message:', message);
				}
			} catch (error) {
				if (error.name !== 'AbortError') window.prompt('Copy this share message:', message);
			}
		}

		async function searchWikipedia(keyword) {
			const params = new URLSearchParams({ action: 'query', list: 'search', srsearch: keyword, format: 'json', origin: '*' });
			const response = await fetch(`https://en.wikipedia.org/w/api.php?${params}`);
			if (!response.ok) throw new Error(`Wikipedia search failed (${response.status}).`);
			const data = await response.json();
			return data.query?.search?.[0]?.title || '';
		}

		async function loadArticle(input = rawText, version = ++loadVersion) {
			try {
				currentTitle = decodeArticleInput(input);
				const articlePath = currentTitle.replace(/ /g, '_');
				currentPageUrl = `https://en.wikipedia.org/wiki/${encodeURIComponent(articlePath)}`;
				const response = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(articlePath)}`, {
					headers: { Accept: 'application/json' }
				});
				if (version !== loadVersion) return;
				if (!response.ok) throw new Error(response.status === 404 ? 'Wikipedia article not found.' : `Wikipedia request failed (${response.status}).`);
				const data = await response.json();
				if (version !== loadVersion) return;
				currentTitle = data.title || currentTitle;
				summary.replaceChildren();
				const title = document.createElement('h1');
				title.textContent = currentTitle;
				const extract = document.createElement('p');
				extract.textContent = data.extract || 'No summary is available for this article.';
				summary.append(title, extract);
				if (data.content_urls?.desktop?.page) currentPageUrl = data.content_urls.desktop.page;
				viewer.src = currentPageUrl;
				viewer.title = `${currentTitle} — Wikipedia`;
				const pageUrl = new URL(window.location.href);
				pageUrl.searchParams.set('txt', currentPageUrl.replace(/^https?:\/\//i, ''));
				window.history.replaceState(null, '', pageUrl);
				status.textContent = '';
			} catch (error) {
				if (version !== loadVersion) return;
				status.textContent = error.message || 'Unable to load this Wikipedia article.';
				status.classList.add('error');
				summary.textContent = 'The article summary could not be loaded.';
			}
		}

		searchForm.addEventListener('submit', async (event) => {
			event.preventDefault();
			const keyword = searchInput.value.trim();
			if (!keyword) {
				status.textContent = 'Enter a Wikipedia search term.';
				status.classList.add('error');
				return;
			}

			const version = ++loadVersion;
			searchButton.disabled = true;
			status.classList.remove('error');
			status.textContent = 'Searching Wikipedia…';
			try {
				const title = await searchWikipedia(keyword);
				if (version !== loadVersion) return;
				if (!title) throw new Error('No matching Wikipedia article was found.');
				await loadArticle(title, version);
			} catch (error) {
				if (version !== loadVersion) return;
				status.textContent = error.message || 'Unable to search Wikipedia.';
				status.classList.add('error');
			} finally {
				if (version === loadVersion) searchButton.disabled = false;
			}
		});

		document.querySelector('#shareButton').addEventListener('click', shareWikipediaPage);
		loadArticle();
	</script>
</body>
</html>
