<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Random Dailymotion Video</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: Arial, sans-serif;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background: #111827;
			color: #f9fafb;
		}

		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
			padding: 1rem 1.25rem;
			background: #1f2937;
		}

		h1 {
			margin: 0;
			font-size: 1.1rem;
		}

		#status {
			margin: 0;
			color: #cbd5e1;
			font-size: 0.9rem;
		}

		button {
			border: 0;
			border-radius: 0.35rem;
			padding: 0.65rem 0.9rem;
			background: #38bdf8;
			color: #082f49;
			cursor: pointer;
			font-weight: 700;
		}

		button:disabled {
			cursor: wait;
			opacity: 0.65;
		}

		iframe {
			display: block;
			width: 100%;
			aspect-ratio: 16 / 9;
			height: auto;
			border: 0;
			background: #000;
		}

		.videoActions { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; padding: 0.75rem; }
		.videoActionRow { display: flex; justify-content: center; gap: 0.6rem; }
		.shareLink, .fullscreenButton { border: 0; border-radius: 0.35rem; padding: 0.65rem 0.9rem; color: #082f49; cursor: pointer; font-size: 1.35rem; font-weight: 700; }
		.shareLink { background: #38bdf8; }
		.fullscreenButton { background: #374151; color: #f9fafb; }
		.fullscreenButton:disabled { cursor: wait; opacity: 0.65; }
		iframe:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; }

		@media (max-width: 42rem) {
			header {
				align-items: flex-start;
				flex-direction: column;
			}
		}
	</style>
	<script src="app-launch.js" defer></script>
</head>
<body>
	<header>
		<h1>Random Dailymotion Video</h1>
		<p id="status" role="status">Choosing a video...</p>
		<button id="randomButton" type="button">Show another</button>
	</header>

	<div id="videoViewer" aria-live="polite"></div>

	<script>
		const SPREADSHEET_ID = '1qkFOAcrXXBjbAJoHLorSyTXMpPrRfBoX5DDGGstiP8M';
		const SHEET_NAME = 'Sheet1';

		function sheetQueryUrl(query) {
			const params = new URLSearchParams({
				sheet: SHEET_NAME,
				tqx: 'out:json',
				tq: query
			});
			return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params}`;
		}

		async function querySheet(query) {
			const response = await fetch(sheetQueryUrl(query), { cache: 'no-store' });
			if (!response.ok) {
				throw new Error(`Google Sheets request failed (${response.status})`);
			}

			const text = await response.text();
			const start = text.indexOf('{');
			const end = text.lastIndexOf('}');
			if (start < 0 || end < start) {
				throw new Error('Invalid Google Sheets response');
			}

			const result = JSON.parse(text.slice(start, end + 1));
			if (result.status !== 'ok') {
				throw new Error(result.errors?.[0]?.detailed_message || 'The sheet query failed');
			}
			return result.table;
		}

		async function getRandomVideoId() {
			const countTable = await querySheet('select count(K) where K is not null');
			const rowCount = Number(countTable.rows?.[0]?.c?.[0]?.v || 0);
			if (!Number.isInteger(rowCount) || rowCount < 1) {
				throw new Error('No video IDs were found in column K.');
			}

			const randomOffset = Math.floor(Math.random() * rowCount);
			const selectedTable = await querySheet(
				`select K where K is not null limit 1 offset ${randomOffset}`
			);
			const videoId = String(selectedTable.rows?.[0]?.c?.[0]?.v || '').trim();
			if (!videoId || /[\s/]/.test(videoId)) {
				throw new Error('The selected cell does not contain a valid Dailymotion video ID.');
			}
			return videoId;
		}

		function createDailymotionPlayer(videoId) {
			const iframe = document.createElement('iframe');
			iframe.title = 'Dailymotion video';
			iframe.allow = 'autoplay; fullscreen; picture-in-picture; web-share';
			iframe.allowFullscreen = true;
			iframe.referrerPolicy = 'strict-origin-when-cross-origin';
			iframe.src = `https://geo.dailymotion.com/player/x1k7p.html?video=${encodeURIComponent(videoId)}&controls=1&autoplay=1&mute=1`;
			return iframe;
		}

		async function getVideoTitle(videoId) {
			try {
				const response = await fetch(`https://api.dailymotion.com/video/${encodeURIComponent(videoId)}?fields=title`);
				if (!response.ok) throw new Error('Video title request failed');
				const data = await response.json();
				return String(data.title || videoId);
			} catch {
				return videoId;
			}
		}

		async function shareVideo(videoId, title) {
			const url = new URL('https://yan1website.github.io/YAN1.home/dailymotion2.html');
			url.searchParams.set('txt', videoId);
			const text = `YAN1 APP GEN 1\nYAN1 APP GEN 1\nFound something interesting — have a look! ✨\n🎬 ${title}\nTHANKS 🙏`;
			try {
				if (navigator.share) {
					await navigator.share({ title, text, url: url.href });
				} else if (navigator.clipboard && window.isSecureContext) {
					await navigator.clipboard.writeText(`${text}\n${url.href}`);
					alert('Permanent link copied. You can paste it into any app.');
				} else {
					window.prompt('Copy this share message and link:', `${text}\n${url.href}`);
				}
			} catch (error) {
				if (error.name !== 'AbortError') window.prompt('Copy this share message and link:', `${text}\n${url.href}`);
			}
		}

		async function loadRandomVideo() {
			const status = document.querySelector('#status');
			const button = document.querySelector('#randomButton');
			const viewer = document.querySelector('#videoViewer');
			button.disabled = true;
			status.textContent = 'Choosing a video...';

			try {
				const videoId = await getRandomVideoId();
				let videoTitle = videoId;
				const player = createDailymotionPlayer(videoId);
				const shareButton = document.createElement('button');
				shareButton.type = 'button';
				shareButton.className = 'shareLink';
				shareButton.textContent = 'ᯓ➤';
				shareButton.setAttribute('aria-label', 'Share this video');
				shareButton.disabled = true;
				shareButton.addEventListener('click', () => shareVideo(videoId, videoTitle));
				const fullscreenButton = document.createElement('button');
				fullscreenButton.type = 'button';
				fullscreenButton.className = 'fullscreenButton';
				fullscreenButton.textContent = '⛶';
				fullscreenButton.setAttribute('aria-label', 'Play video in fullscreen');
				fullscreenButton.title = 'Play video in fullscreen';
				fullscreenButton.addEventListener('click', () => {
					if (player.requestFullscreen) {
						player.requestFullscreen().catch(error => console.error('Unable to enter fullscreen:', error));
					}
				});
				const actions = document.createElement('div');
				actions.className = 'videoActions';
				const actionRow = document.createElement('div');
				actionRow.className = 'videoActionRow';
				actionRow.append(shareButton, fullscreenButton);
				actions.append(actionRow, button);
				viewer.replaceChildren(player, actions);
				status.textContent = `Showing ${videoId}`;
				getVideoTitle(videoId).then(title => {
					videoTitle = title;
					shareButton.disabled = false;
				});
			} catch (error) {
				viewer.replaceChildren();
				document.querySelector('header').append(button);
				status.textContent = error.message;
			} finally {
				button.disabled = false;
			}
		}

		document.querySelector('#randomButton').addEventListener('click', loadRandomVideo);
		loadRandomVideo();
	</script>
</body>
</html>
