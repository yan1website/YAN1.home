<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Opening Game</title>
	<style>
		body { margin: 0; padding: 2rem; font: 16px Arial, sans-serif; color: #17211b; background: #f5f0e7; text-align: center; }
		a { color: #b93d28; }
		button { margin-top: 1rem; padding: 0.7rem 1rem; border: 0; background: #263b32; color: white; cursor: pointer; font-weight: 700; }
		button:disabled { cursor: wait; opacity: 0.6; }
	</style>
	<script src="app-launch.js" defer></script>
</head>
<body>
	<p id="status" role="status" aria-live="polite">Opening game…</p>
	<button id="share-button" type="button" disabled>Share game</button>
	<script>
		const GAME_BASE_URL = 'https://www.addictinggames.com/embed/html5-games/';
		const gameId = new URLSearchParams(window.location.search).get('txt')?.trim() || '';
		const status = document.querySelector('#status');
		const shareButton = document.querySelector('#share-button');

		async function shareGame() {
			const url = new URL('https://yan1website.github.io/YAN1.home/index.html?games2.html');
			url.searchParams.set('txt', gameId);
			const text = 'YAN1 APP GEN 1\nYAN1 APP GEN 1\nFound something interesting — have a look! ✨\n🎮 \nTHANKS 🙏';
			try {
				if (navigator.share) {
					await navigator.share({ title: 'Game', text, url: url.href });
				} else if (navigator.clipboard && window.isSecureContext) {
					await navigator.clipboard.writeText(`${text}\n${url.href}`);
					status.textContent = 'Share message and link copied.';
				} else {
					window.prompt('Copy this share message and link:', `${text}\n${url.href}`);
				}
			} catch (error) {
				if (error.name !== 'AbortError') window.prompt('Copy this share message and link:', `${text}\n${url.href}`);
			}
		}

		shareButton.addEventListener('click', shareGame);

		if (!gameId || /[\s/]/.test(gameId)) {
			status.textContent = 'This link does not contain a valid game ID.';
		} else {
			shareButton.disabled = false;
			const gameUrl = `${GAME_BASE_URL}${encodeURIComponent(gameId)}`;
			const gameTab = window.open(gameUrl, '_blank', 'noopener,noreferrer');
			if (gameTab) {
				status.textContent = 'Your game was opened in a new tab.';
			} else {
				status.innerHTML = 'Your browser blocked the new tab. <a target="_blank" rel="noopener noreferrer"></a>';
				const link = status.querySelector('a');
				link.href = gameUrl;
				link.textContent = 'Open the game';
			}
		}
	</script>
</body>
</html>
