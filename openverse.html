<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Free Media Search - Openverse</title>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f5f5f5;

    color: #222;

}


/* =========================================================
   HEADER
========================================================= */

header {

    background: #222;

    color: white;

    padding: 25px 20px;

    text-align: center;

}

header h1 {

    margin: 0 0 8px;

}

header p {

    margin: 0;

    color: #ddd;

}


/* =========================================================
   SEARCH
========================================================= */

.search-box {

    max-width: 900px;

    margin: 25px auto;

    padding: 0 15px;

    display: flex;

    gap: 10px;

}

.search-box input {

    flex: 1;

    padding: 14px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;

}

.search-box select {

    padding: 14px;

    border: 1px solid #ccc;

    border-radius: 8px;

    background: white;

    font-size: 15px;

}

.search-box button {

    padding: 14px 25px;

    border: none;

    border-radius: 8px;

    background: #159957;

    color: white;

    cursor: pointer;

    font-size: 16px;

}

.search-box button:hover {

    background: #117a45;

}


/* =========================================================
   STATUS
========================================================= */

#status {

    text-align: center;

    margin: 20px;

    color: #666;

}


/* =========================================================
   RESULTS GRID
========================================================= */

.results {

    max-width: 1400px;

    margin: auto;

    padding: 20px;

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(250px, 1fr));

    gap: 20px;

}


/* =========================================================
   CARD
========================================================= */

.card {

    background: white;

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 2px 10px rgba(0,0,0,.1);

}


/* =========================================================
   IMAGE AREA

   IMPORTANT:
   contain = entire image is visible
========================================================= */

.image-container {

    width: 100%;

    height: 250px;

    background: #eee;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    cursor: pointer;

}


/* =========================================================
   IMAGE

   Entire image visible
========================================================= */

.image-container img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: block;

    transition: transform .2s ease;

}

.image-container:hover img {

    transform: scale(1.03);

}


/* =========================================================
   CARD CONTENT
========================================================= */

.card-content {

    padding: 15px;

}

.card-title {

    font-weight: bold;

    margin-bottom: 8px;

    line-height: 1.4;

}

.creator {

    font-size: 13px;

    color: #666;

    margin-bottom: 5px;

}

.license {

    font-size: 12px;

    color: #777;

    margin-bottom: 10px;

}


/* =========================================================
   LINKS / BUTTONS
========================================================= */

.card a {

    display: inline-block;

    margin-top: 5px;

    margin-right: 8px;

    padding: 8px 12px;

    border-radius: 6px;

    background: #159957;

    color: white;

    text-decoration: none;

    font-size: 13px;

}

.card a:hover {

    background: #117a45;

}


/* =========================================================
   AUDIO
========================================================= */

.audio-player {

    width: 100%;

    margin-bottom: 10px;

}


/* =========================================================
   LOAD MORE
========================================================= */

.load-more-container {

    text-align: center;

    padding: 30px 20px 50px;

}

#loadMoreButton {

    padding: 15px 40px;

    border: none;

    border-radius: 8px;

    background: #222;

    color: white;

    cursor: pointer;

    font-size: 16px;

    min-width: 160px;

}

#loadMoreButton:hover {

    background: #444;

}

#loadMoreButton:disabled {

    background: #999;

    cursor: not-allowed;

}


/* =========================================================
   FULL SCREEN IMAGE VIEWER
========================================================= */

#imageViewer {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.95);

    z-index: 99999;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    padding: 20px;

}


/* =========================================================
   FULL SCREEN IMAGE
========================================================= */

#fullScreenImage {

    max-width: 95vw;

    max-height: 85vh;

    width: auto;

    height: auto;

    object-fit: contain;

    display: block;

}


/* =========================================================
   VIEWER CONTROLS
========================================================= */

.viewer-controls {

    display: flex;

    gap: 10px;

    margin-top: 15px;

    flex-wrap: wrap;

    justify-content: center;

}

.viewer-button {

    border: none;

    border-radius: 7px;

    padding: 12px 20px;

    font-size: 15px;

    cursor: pointer;

    background: white;

    color: #222;

}

.viewer-button:hover {

    background: #ddd;

}

.download-button {

    background: #159957;

    color: white;

}

.download-button:hover {

    background: #117a45;

}


/* =========================================================
   CLOSE BUTTON
========================================================= */

#closeViewer {

    position: absolute;

    top: 15px;

    right: 20px;

    width: 45px;

    height: 45px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,.15);

    color: white;

    font-size: 28px;

    cursor: pointer;

}

#closeViewer:hover {

    background: rgba(255,255,255,.3);

}


/* =========================================================
   VIEWER TITLE
========================================================= */

#viewerTitle {

    max-width: 90vw;

    margin-top: 12px;

    text-align: center;

    color: white;

    font-size: 14px;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .search-box {

        flex-direction: column;

    }

    .search-box input,
    .search-box select,
    .search-box button {

        width: 100%;

    }

    .results {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 10px;

        padding: 10px;

    }

    .image-container {

        height: 180px;

    }

    .card-content {

        padding: 10px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <h1>
        Free Media Search
    </h1>

    <p>
        Search openly licensed media using Openverse
    </p>

</header>


<!-- =========================================================
     SEARCH BOX
========================================================= -->

<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="Search nature, space, cars..."
    >


    <select id="mediaType">

        <option value="images">
            Images
        </option>

        <option value="audio">
            Audio
        </option>

    </select>


    <button onclick="newSearch()">

        Search

    </button>

</div>


<!-- =========================================================
     STATUS
========================================================= -->

<div id="status"></div>


<!-- =========================================================
     RESULTS
========================================================= -->

<div
    id="results"
    class="results"
></div>


<!-- =========================================================
     LOAD MORE
========================================================= -->

<div
    id="loadMoreContainer"
    class="load-more-container"
    style="display:none;"
>

    <button
        id="loadMoreButton"
        onclick="loadMore()"
    >

        Load More

    </button>

</div>


<!-- =========================================================
     FULL SCREEN IMAGE VIEWER
========================================================= -->

<div id="imageViewer">


    <button
        id="closeViewer"
        onclick="closeImageViewer()"
        aria-label="Close"
    >

        ×

    </button>


    <img
        id="fullScreenImage"
        src=""
        alt=""
    >


    <div
        id="viewerTitle"
    ></div>


    <div class="viewer-controls">


        <button
            class="viewer-button download-button"
            onclick="downloadCurrentImage()"
        >

            ↓ Download

        </button>


        <button
            class="viewer-button"
            onclick="openCurrentSource()"
        >

            View Source

        </button>


        <button
            class="viewer-button"
            onclick="closeImageViewer()"
        >

            Close

        </button>


    </div>


</div>


<script>


/* =========================================================
   SETTINGS
========================================================= */

const API_BASE =
    "https://api.openverse.org/v1";


const RESULTS_PER_PAGE = 20;

const SHEET_ID =
    "1qkFOAcrXXBjbAJoHLorSyTXMpPrRfBoX5DDGGstiP8M";

const SHEET_QUERY_URL =
    "https://docs.google.com/spreadsheets/d/" +
    SHEET_ID +
    "/gviz/tq";


/* =========================================================
   VARIABLES
========================================================= */

let currentPage = 1;

let currentQuery = "";

let currentType = "images";

let isLoading = false;


/* =========================================================
   CURRENT IMAGE

   Used by the full-screen viewer
========================================================= */

let currentImageURL = "";

let currentSourceURL = "";

let currentImageTitle = "";


/* =========================================================
   RANDOM SEARCH FROM GOOGLE SHEETS COLUMN G
========================================================= */

async function sheetQuery(query) {


    const url =
        SHEET_QUERY_URL +
        "?tqx=out:json&headers=0&tq=" +
        encodeURIComponent(query);


    const response =
        await fetch(url);


    if (!response.ok) {


        throw new Error(
            "Google Sheets HTTP " +
            response.status
        );

    }


    const text =
        await response.text();


    const start =
        text.indexOf("{");


    const end =
        text.lastIndexOf("}");


    if (start < 0 || end < start) {


        throw new Error(
            "Invalid Google Sheets response"
        );

    }


    return JSON.parse(
        text.substring(
            start,
            end + 1
        )
    ).table;

}


async function getRandomSheetSearch() {


    const countTable =
        await sheetQuery(
            "select count(G) where G is not null"
        );


    const rowCount =
        Number(
            countTable.rows?.[0]?.c?.[0]?.v ||
            0
        );


    if (!rowCount) {


        return "";

    }


    const randomOffset =
        Math.floor(
            Math.random() * rowCount
        );


    const valueTable =
        await sheetQuery(
            "select G where G is not null limit 1 offset " +
            randomOffset
        );


    return String(
        valueTable.rows?.[0]?.c?.[0]?.v ||
        ""
    ).trim();

}


async function startWithRandomSheetSearch() {


    const input =
        document.getElementById(
            "searchInput"
        );


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Choosing a search...";


    try {


        const randomSearch =
            await getRandomSheetSearch();


        input.value =
            randomSearch ||
            "nature";


    } catch (error) {


        console.warn(
            "Unable to choose a search from Google Sheets:",
            error
        );


        input.value =
            "nature";


    }


    newSearch();

}


/* =========================================================
   NEW SEARCH
========================================================= */

function newSearch() {


    const input =
        document.getElementById(
            "searchInput"
        );


    const query =
        input.value.trim();


    if (!query) {


        document.getElementById(
            "status"
        ).textContent =
            "Please enter a search term.";


        return;

    }


    /*
       Save search
    */

    currentQuery = query;


    currentType =
        document.getElementById(
            "mediaType"
        ).value;


    /*
       Reset page
    */

    currentPage = 1;


    /*
       Clear results
    */

    document.getElementById(
        "results"
    ).innerHTML = "";


    /*
       Hide Load More
    */

    document.getElementById(
        "loadMoreContainer"
    ).style.display = "none";


    /*
       Start search
    */

    fetchResults(false);

}


/* =========================================================
   FETCH RESULTS
========================================================= */

async function fetchResults(
    append = false
) {


    if (isLoading) {

        return;

    }


    isLoading = true;


    const status =
        document.getElementById(
            "status"
        );


    const loadMoreContainer =
        document.getElementById(
            "loadMoreContainer"
        );


    const loadMoreButton =
        document.getElementById(
            "loadMoreButton"
        );


    /*
       Loading state
    */

    if (append) {


        loadMoreButton.disabled =
            true;


        loadMoreButton.textContent =
            "Loading...";


    } else {


        status.textContent =
            "Searching...";

    }


    try {


        const url =
            API_BASE +
            "/" +
            currentType +
            "/?q=" +
            encodeURIComponent(
                currentQuery
            ) +
            "&page=" +
            currentPage +
            "&page_size=" +
            RESULTS_PER_PAGE;


        console.log(
            "Openverse request:",
            url
        );


        const response =
            await fetch(url);


        if (!response.ok) {


            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Openverse response:",
            data
        );


        const items =
            data.results || [];


        /*
           No results
        */

        if (
            items.length === 0 &&
            currentPage === 1
        ) {


            status.textContent =
                "No results found.";


            loadMoreContainer.style.display =
                "none";


            return;

        }


        /*
           Display results
        */

        displayResults(
            items
        );


        /*
           Count cards
        */

        const displayed =
            document.querySelectorAll(
                ".card"
            ).length;


        status.textContent =
            "Showing " +
            displayed +
            " results";


        /*
           Show Load More if
           this page returned 20 items.
        */

        if (
            items.length ===
            RESULTS_PER_PAGE
        ) {


            loadMoreContainer.style.display =
                "block";


            loadMoreButton.disabled =
                false;


            loadMoreButton.textContent =
                "Load More";


        } else {


            loadMoreContainer.style.display =
                "none";

        }


    } catch (error) {


        console.error(
            "Openverse error:",
            error
        );


        status.textContent =
            "Failed to load results.";


        if (append) {


            loadMoreButton.disabled =
                false;


            loadMoreButton.textContent =
                "Load More";

        }


    } finally {


        isLoading = false;

    }

}


/* =========================================================
   LOAD MORE
========================================================= */

function loadMore() {


    if (isLoading) {

        return;

    }


    currentPage++;


    fetchResults(true);

}


/* =========================================================
   DISPLAY RESULTS
========================================================= */

function displayResults(items) {


    const results =
        document.getElementById(
            "results"
        );


    items.forEach(
        item => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            if (
                currentType ===
                "images"
            ) {


                displayImage(
                    card,
                    item
                );


            } else {


                displayAudio(
                    card,
                    item
                );

            }


            results.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   DISPLAY IMAGE
========================================================= */

function displayImage(
    card,
    item
) {


    /*
       Openverse provides different
       image URL fields depending
       on the source.
    */

    const imageURL =
        item.url ||
        item.thumbnail;


    const thumbnailURL =
        item.thumbnail ||
        item.url;


    const title =
        item.title ||
        "Untitled";


    const creator =
        item.creator ||
        "Unknown creator";


    const license =
        item.license
            ? item.license.toUpperCase()
            : "License information unavailable";


    const sourceURL =
        item.foreign_landing_url ||
        item.url ||
        "#";


    /*
       Create image container
    */

    const imageContainer =
        document.createElement(
            "div"
        );


    imageContainer.className =
        "image-container";


    /*
       Create image
    */

    const image =
        document.createElement(
            "img"
        );


    image.src =
        thumbnailURL;


    image.loading =
        "lazy";


    image.alt =
        title;


    /*
       Clicking the image
       opens full screen
    */

    imageContainer.addEventListener(
        "click",
        function() {


            openImageViewer(
                imageURL,
                sourceURL,
                title
            );


        }
    );


    imageContainer.appendChild(
        image
    );


    /*
       Card information
    */

    const content =
        document.createElement(
            "div"
        );


    content.className =
        "card-content";


    content.innerHTML = `

        <div class="card-title">

            ${escapeHTML(title)}

        </div>


        <div class="creator">

            Creator:
            ${escapeHTML(creator)}

        </div>


        <div class="license">

            License:
            ${escapeHTML(license)}

        </div>


        <a
            href="${escapeHTML(sourceURL)}"
            target="_blank"
            rel="noopener noreferrer"
        >

            View Source

        </a>

    `;


    /*
       Add everything to card
    */

    card.appendChild(
        imageContainer
    );


    card.appendChild(
        content
    );

}


/* =========================================================
   DISPLAY AUDIO
========================================================= */

function displayAudio(
    card,
    item
) {


    const audioURL =
        item.url;


    const title =
        item.title ||
        "Untitled";


    const creator =
        item.creator ||
        "Unknown creator";


    const license =
        item.license
            ? item.license.toUpperCase()
            : "License information unavailable";


    const sourceURL =
        item.foreign_landing_url ||
        item.url ||
        "#";


    card.innerHTML = `

        <div class="card-content">

            <div class="card-title">

                ${escapeHTML(title)}

            </div>


            <div class="creator">

                Creator:
                ${escapeHTML(creator)}

            </div>


            <div class="license">

                License:
                ${escapeHTML(license)}

            </div>


            <audio
                class="audio-player"
                controls
                preload="none"
            >

                <source
                    src="${escapeHTML(audioURL)}"
                >


                Your browser does not support
                audio playback.

            </audio>


            <a
                href="${escapeHTML(sourceURL)}"
                target="_blank"
                rel="noopener noreferrer"
            >

                View Source

            </a>

        </div>

    `;

}


/* =========================================================
   OPEN FULL SCREEN IMAGE
========================================================= */

function openImageViewer(
    imageURL,
    sourceURL,
    title
) {


    currentImageURL =
        imageURL;


    currentSourceURL =
        sourceURL;


    currentImageTitle =
        title;


    const viewer =
        document.getElementById(
            "imageViewer"
        );


    const image =
        document.getElementById(
            "fullScreenImage"
        );


    const viewerTitle =
        document.getElementById(
            "viewerTitle"
        );


    /*
       Set image
    */

    image.src =
        imageURL;


    image.alt =
        title;


    /*
       Set title
    */

    viewerTitle.textContent =
        title;


    /*
       Show viewer
    */

    viewer.style.display =
        "flex";


    /*
       Prevent background scrolling
    */

    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   CLOSE FULL SCREEN IMAGE
========================================================= */

function closeImageViewer() {


    const viewer =
        document.getElementById(
            "imageViewer"
        );


    const image =
        document.getElementById(
            "fullScreenImage"
        );


    viewer.style.display =
        "none";


    image.src =
        "";


    document.body.style.overflow =
        "";

}


/* =========================================================
   OPEN SOURCE
========================================================= */

function openCurrentSource() {


    if (
        currentSourceURL &&
        currentSourceURL !== "#"
    ) {


        window.open(
            currentSourceURL,
            "_blank",
            "noopener"
        );

    }

}


/* =========================================================
   DOWNLOAD IMAGE
========================================================= */

async function downloadCurrentImage() {


    if (!currentImageURL) {

        return;

    }


    const button =
        document.querySelector(
            ".download-button"
        );


    const originalText =
        button.textContent;


    button.disabled =
        true;


    button.textContent =
        "Downloading...";


    try {


        /*
           Try fetching the image
           so it downloads instead
           of opening in the browser.
        */

        const response =
            await fetch(
                currentImageURL,
                {
                    mode: "cors"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Download failed"
            );

        }


        const blob =
            await response.blob();


        const blobURL =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            blobURL;


        link.download =
            createFileName(
                currentImageTitle
            );


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        URL.revokeObjectURL(
            blobURL
        );


    } catch (error) {


        console.warn(
            "Direct download unavailable:",
            error
        );


        /*
           Some image providers
           block cross-origin downloads.

           In that situation open
           the image URL in a new tab.
        */

        window.open(
            currentImageURL,
            "_blank"
        );

    } finally {


        button.disabled =
            false;


        button.textContent =
            originalText;

    }

}


/* =========================================================
   CREATE FILE NAME
========================================================= */

function createFileName(
    title
) {


    let name =
        String(title || "image");


    name =
        name
            .replace(
                /[^a-z0-9]+/gi,
                "-"
            )
            .replace(
                /^-+|-+$/g,
                ""
            );


    if (!name) {

        name =
            "image";

    }


    return name +
        ".jpg";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
) {


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ENTER KEY
========================================================= */

startWithRandomSheetSearch();

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        function(event) {


            if (
                event.key ===
                "Enter"
            ) {


                newSearch();

            }

        }
    );


/* =========================================================
   ESC KEY CLOSES VIEWER
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Escape"
        ) {


            closeImageViewer();

        }

    }
);


/* =========================================================
   CLICK OUTSIDE IMAGE TO CLOSE
========================================================= */

document
    .getElementById(
        "imageViewer"
    )
    .addEventListener(
        "click",
        function(event) {


            if (
                event.target ===
                this
            ) {


                closeImageViewer();

            }

        }
    );

</script>


</body>

</html>
