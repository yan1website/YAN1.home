<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GitHub Repository</title>
	<style>
		:root { --bg:#f4f7fb; --panel:#fff; --panel-2:#f8fafc; --text:#1f2937; --muted:#5b6475; --line:#dfe7f1; --primary:#2563eb; --primary-dark:#1d4ed8; }
		* { box-sizing:border-box; }
		body { margin:0; padding:20px; color:var(--text); background:linear-gradient(180deg,#eef4ff 0%,var(--bg) 100%); font:16px Arial,Helvetica,sans-serif; }
		main { max-width:980px; margin:24px auto; }
		#status { text-align:center; padding:18px; color:var(--muted); font-weight:700; }
		.repo { margin:20px 0; padding:22px 24px; border:1px solid var(--line); border-radius:16px; background:var(--panel); box-shadow:0 10px 25px rgba(15,23,42,.06); }
		.repo h1 { margin:0 0 10px; font-size:1.5rem; overflow-wrap:anywhere; }
		.repo .meta { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; }
		.repo .tag { padding:6px 10px; border:1px solid var(--line); border-radius:999px; background:var(--panel-2); color:var(--muted); font-size:.82rem; }
		.repo p { margin:10px 0; line-height:1.6; overflow-wrap:anywhere; }
		.label { color:var(--muted); font-weight:700; }
		a { color:var(--primary); font-weight:700; text-decoration:none; }
		a:hover { text-decoration:underline; }
		.website { display:inline-block; margin-top:8px; padding:8px 12px; border:1px solid rgba(16,185,129,.18); border-radius:10px; background:rgba(16,185,129,.08); }
		.actions { display:flex; justify-content:center; margin-top:16px; }
		.share-button { padding:6px 9px; border:0; border-radius:8px; color:white; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); cursor:pointer; font-size:14px; line-height:1; }
		.error { color:#a32918 !important; }
		@media(max-width:640px) { body { padding:0; } .repo { padding:18px; } }
	</style>
	<script src="app-launch.js" defer></script>
</head>
<body>
	<main>
		<p id="status" role="status" aria-live="polite">Loading repository…</p>
		<div id="results"></div>
	</main>
	<script>
		const status = document.querySelector('#status');
		const results = document.querySelector('#results');
		const repoPath = (new URLSearchParams(window.location.search).get('txt') || '').trim();

		async function shareRepository() {
			const url = new URL('https://yan1website.github.io/YAN1.home/github2.html');
			url.searchParams.set('txt', repoPath);
			try {
				if (navigator.share) {
					await navigator.share({ title: repoPath, url: url.href });
				} else if (navigator.clipboard && window.isSecureContext) {
					await navigator.clipboard.writeText(url.href);
					alert('Permanent link copied. You can paste it into any app.');
				} else {
					window.prompt('Copy this permanent link:', url.href);
				}
			} catch (error) {
				if (error.name !== 'AbortError') window.prompt('Copy this permanent link:', url.href);
			}
		}

		function addText(parent, tag, text, className) {
			const element = document.createElement(tag);
			if (className) element.className = className;
			element.textContent = text;
			parent.append(element);
			return element;
		}

		function addLabeledLine(parent, label, value) {
			const line = document.createElement('p');
			const labelElement = document.createElement('span');
			labelElement.className = 'label';
			labelElement.textContent = `${label}: `;
			line.append(labelElement, document.createTextNode(value));
			parent.append(line);
		}

		async function loadRepository() {
			if (!/^[^/]+\/[^/]+$/.test(repoPath)) {
				status.textContent = 'This link does not contain a valid owner/repository path.';
				status.classList.add('error');
				return;
			}

			try {
				const response = await fetch(`https://api.github.com/repos/${repoPath.split('/').map(encodeURIComponent).join('/')}`, {
					headers: { Accept: 'application/vnd.github+json' }
				});
				if (!response.ok) {
					if (response.status === 404) throw new Error('Repository not found or no longer public.');
					if (response.status === 403) throw new Error('GitHub API rate limit reached. Please try again later.');
					throw new Error(`GitHub request failed (${response.status}).`);
				}
				const repo = await response.json();
				const card = document.createElement('article');
				card.className = 'repo';
				addText(card, 'h1', repo.full_name || repoPath);
				addText(card, 'p', repo.description || 'No description');

				const meta = document.createElement('div');
				meta.className = 'meta';
				[
					`⭐ ${repo.stargazers_count} Stars`,
					`🍴 ${repo.forks_count} Forks`,
					`Language: ${repo.language || 'Unknown'}`,
					`Owner: ${repo.owner?.login || 'Unknown'}`
				].forEach(text => addText(meta, 'span', text, 'tag'));
				card.append(meta);

				addLabeledLine(card, 'Topics', repo.topics?.length ? repo.topics.join(', ') : 'None');
				addLabeledLine(card, 'License', repo.license?.name || 'None');
				addLabeledLine(card, 'Updated', repo.updated_at || 'Unknown');
				if (repo.homepage?.trim()) {
					const line = document.createElement('p');
					const label = document.createElement('span');
					label.className = 'label';
					label.textContent = 'Website: ';
					const link = document.createElement('a');
					link.className = 'website';
					link.href = repo.homepage;
					link.target = '_blank';
					link.rel = 'noopener noreferrer';
					link.textContent = repo.homepage;
					line.append(label, link);
					card.append(line);
				}

				const repoLine = document.createElement('p');
				const repoLink = document.createElement('a');
				repoLink.href = repo.html_url;
				repoLink.target = '_blank';
				repoLink.rel = 'noopener noreferrer';
				repoLink.textContent = 'Open Repository';
				repoLine.append(repoLink);
				card.append(repoLine);

				const shareButton = document.createElement('button');
				shareButton.type = 'button';
				shareButton.className = 'share-button';
				shareButton.textContent = '➤';
				shareButton.setAttribute('aria-label', 'Share repository');
				shareButton.addEventListener('click', shareRepository);
				const actions = document.createElement('div');
				actions.className = 'actions';
				actions.append(shareButton);
				card.append(actions);

				results.replaceChildren(card);
				status.textContent = '';
			} catch (error) {
				status.textContent = error.message || 'Unable to load repository details.';
				status.classList.add('error');
			}
		}

		loadRepository();
	</script>
</body>
</html>
