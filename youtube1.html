<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>YouTube</title>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: #111; color: #fff; font-family: Arial, sans-serif; }
		main { width: min(100%, 1120px); text-align: center; }
		#status { margin: 20px 0; color: #aaa; overflow-wrap: anywhere; }
		.video-container { position: relative; display: none; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; background: #000; }
		.thumbnail-button, .thumbnail-button img, iframe { width: 100%; height: 100%; border: 0; }
		.thumbnail-button { position: absolute; inset: 0; padding: 0; cursor: pointer; background: #000; }
		.thumbnail-button img { display: block; object-fit: cover; }
		.play-icon { position: absolute; top: 50%; left: 50%; width: 72px; height: 52px; transform: translate(-50%, -50%); border-radius: 14px; background: #f00; }
		.play-icon::after { position: absolute; top: 14px; left: 29px; content: ''; border-top: 12px solid transparent; border-bottom: 12px solid transparent; border-left: 18px solid #fff; }
		iframe { display: none; }
		.video-actions { display: none; justify-content: center; margin-top: 12px; }
		.share-button { padding: 7px 10px; border: 0; border-radius: 7px; color: #fff; background: #2563eb; cursor: pointer; font-size: 14px; line-height: 1; }
		@media(max-width: 600px) { body { padding: 12px; } }
	</style>
	<script src="app-launch.js" defer></script>
</head>
<body>
	<main>
		<p id="status" role="status" aria-live="polite">Loading video…</p>
		<div id="videoContainer" class="video-container">
			<button id="thumbnailButton" class="thumbnail-button" type="button" aria-label="Play YouTube video">
				<img id="videoThumbnail" alt="YouTube video thumbnail">
				<span class="play-icon" aria-hidden="true"></span>
			</button>
			<iframe id="youtubePlayer" title="YouTube video" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
		</div>
		<div id="videoActions" class="video-actions">
			<button id="shareButton" class="share-button" type="button" aria-label="Share this video">➤</button>
		</div>
	</main>
	<script>
		const rawVideoValue = (new URLSearchParams(window.location.search).get('txt') || '').trim();
		const status = document.querySelector('#status');
		const videoContainer = document.querySelector('#videoContainer');
		const thumbnailButton = document.querySelector('#thumbnailButton');
		const thumbnail = document.querySelector('#videoThumbnail');
		const player = document.querySelector('#youtubePlayer');
		let videoId = '';
		let videoTitlePromise = Promise.resolve('YouTube video');

		function getYouTubeId(value) {
			let candidate = value;
			if (/^https?:\/\//i.test(candidate)) {
				const url = new URL(candidate);
				if (url.hostname === 'youtu.be') candidate = url.pathname.slice(1);
				else if (url.hostname.endsWith('youtube.com')) candidate = url.searchParams.get('v') || url.pathname.split('/').filter(Boolean).pop() || '';
			} else {
				candidate = candidate.split(/[?&]/)[0];
			}
			return /^[a-zA-Z0-9_-]{11}$/.test(candidate) ? candidate : '';
		}

		async function fetchVideoTitle(id) {
			const videoUrl = `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
			const response = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(videoUrl)}&format=json`);
			if (!response.ok) throw new Error('Unable to retrieve the YouTube title.');
			const data = await response.json();
			return data.title || 'YouTube video';
		}

		function setVideoThumbnail(id) {
			thumbnail.onerror = () => {
				if (thumbnail.dataset.fallback) return;
				thumbnail.dataset.fallback = 'true';
				thumbnail.src = `https://img.youtube.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;
			};
			thumbnail.src = `https://img.youtube.com/vi/${encodeURIComponent(id)}/maxresdefault.jpg`;
		}

		async function shareVideo() {
			if (!rawVideoValue) return;
			const url = new URL('https://yan1website.github.io/YAN1.home/youtube1.html');
			url.searchParams.set('txt', rawVideoValue);
			const videoTitle = await videoTitlePromise;
			const shareTitle = 'YAN1 APP GEN 1';
			const shareText = [
				'YAN1 APP GEN 1',
				'YAN1 APP GEN 1',
				'Found something interesting — have a look! ✨',
				`🎬 ${videoTitle}`,
				'THANKS 🙏'
			].join('\n');
			const message = `${shareText}\n${url.href}`;
			try {
				if (navigator.share) {
					await navigator.share({ title: shareTitle, text: shareText, url: url.href });
				} else if (navigator.clipboard && window.isSecureContext) {
					await navigator.clipboard.writeText(message);
					alert('YouTube share message copied. You can paste it into any app.');
				} else {
					window.prompt('Copy this YouTube share message:', message);
				}
			} catch (error) {
				if (error.name !== 'AbortError') window.prompt('Copy this YouTube share message:', message);
			}
		}

		videoId = getYouTubeId(rawVideoValue);
		if (!videoId) {
			status.textContent = 'This link does not contain a valid YouTube video ID.';
		} else {
			setVideoThumbnail(videoId);
			videoTitlePromise = fetchVideoTitle(videoId).catch(() => 'YouTube video');
			thumbnailButton.addEventListener('click', () => {
				player.src = `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?autoplay=1&origin=${encodeURIComponent(window.location.origin)}`;
				player.style.display = 'block';
				thumbnailButton.style.display = 'none';
			}, { once: true });
			videoContainer.style.display = 'block';
			document.querySelector('#videoActions').style.display = 'flex';
			document.querySelector('#shareButton').addEventListener('click', shareVideo);
			status.textContent = '';
		}
	</script>
</body>
</html>
